<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Magic Battle — Inventory</title>
<link rel="stylesheet" href="magic-forge.css?v=9"/>
<link rel="stylesheet" href="slot-chooser.css?v=3"/>
<script src="auth-gate.js?v=4"></script>
<style>
/* ============================================================
   ROOT & RESET
   ============================================================ */
:root{
	--bg:#12101e;--panel:rgba(255,255,255,.05);--panel2:rgba(255,255,255,.08);
	--border:rgba(255,255,255,.15);--text:#e8eaff;--muted:#9ea4c4;
	--accent:#6c5ce7;--accent2:#a29bfe;--green:#28a745;--red:#e74c3c;
	--blue:#3498db;--gold:#f1c40f;--orange:#e67e22;--purple:#9b59b6;
	--slot-bg:rgba(255,255,255,.04);--slot-hover:rgba(255,255,255,.1);
	--rarity-common:#aaa;--rarity-uncommon:#2ecc71;--rarity-rare:#3498db;
	--rarity-epic:#9b59b6;--rarity-legendary:#f39c12;--rarity-mythical:#cc44ff;
	--rarity-mythic:#ffd700;--rarity-pink:#ff4ec4;
	--rarity-cursed:#c0392b;--rarity-corrupted:#c0392b;--rarity-nightmare:#e070ff;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
button{cursor:pointer;font-family:inherit}
input,select{font-family:inherit;color-scheme:dark}
select,select option{background:#1c1a30;color:#e8eaff}

/* ============================================================
   LAYOUT – three-column with top bar
   ============================================================ */
#topBar{
	display:flex;align-items:center;justify-content:space-between;
	padding:10px 18px;background:rgba(0,0,0,.35);border-bottom:1px solid var(--border);
	height:52px;
}
#topBar h1{font-size:20px;letter-spacing:1px}
#backBtn{
	padding:6px 16px;font-size:13px;background:rgba(255,255,255,.1);color:#ccc;
	border:1px solid var(--border);border-radius:5px;transition:background .2s;
}
#backBtn:hover{background:rgba(255,255,255,.2)}

/* stats bar */
.stats-bar{display:flex;gap:16px;align-items:center}
.stat-chip{
	display:flex;align-items:center;gap:5px;padding:4px 10px;
	background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:6px;
	font-size:12px;
}
.stat-chip .stat-icon{font-size:15px}
.stat-chip .stat-val{font-weight:700;color:#fff}

/* columns */
#mainWrap{display:flex;height:calc(100vh - 52px);overflow:hidden}
#leftCol{width:240px;min-width:200px;border-right:1px solid var(--border);padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
#centerCol{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
#rightCol{width:280px;min-width:240px;border-left:1px solid var(--border);padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}

/* ============================================================
   PANEL GENERIC
   ============================================================ */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px}
.panel h3{font-size:14px;margin-bottom:10px;color:var(--accent2);text-transform:uppercase;letter-spacing:.5px}

/* ============================================================
   EQUIPMENT SLOTS (left col)
   ============================================================ */
.equip-slot{
	display:flex;align-items:center;gap:10px;padding:8px 10px;
	background:var(--slot-bg);border:2px dashed var(--border);border-radius:8px;
	min-height:56px;cursor:pointer;transition:background .2s,border-color .2s;
	position:relative;
}
.equip-slot:hover{background:var(--slot-hover);border-color:rgba(255,255,255,.3)}
.equip-slot.filled{border-style:solid}
.equip-slot .eq-icon{font-size:26px;width:36px;text-align:center;flex-shrink:0}
.equip-slot .eq-info{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.equip-slot .eq-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.equip-slot .eq-sub{font-size:11px;color:var(--muted)}
.equip-slot .eq-label{font-size:11px;color:var(--muted);font-style:italic}
.equip-slot .unequip-btn{
	position:absolute;top:4px;right:6px;background:none;border:none;color:var(--red);
	font-size:14px;opacity:.6;transition:opacity .2s;
}
.equip-slot .unequip-btn:hover{opacity:1}

/* ============================================================
   INVENTORY GRID (center col)
   ============================================================ */
.inv-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inv-toolbar input[type=text]{
	flex:1;min-width:160px;padding:7px 12px;font-size:13px;
	background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:6px;
	color:#fff;outline:none;transition:border-color .2s;
}
.inv-toolbar input:focus{border-color:var(--accent)}
.inv-page-info{font-size:12px;color:var(--muted);white-space:nowrap}
.inv-page-btn{
	padding:4px 10px;font-size:13px;background:rgba(255,255,255,.08);
	color:#ccc;border:1px solid var(--border);border-radius:5px;transition:background .2s;
}
.inv-page-btn:hover:not(:disabled){background:rgba(255,255,255,.16)}
.inv-page-btn:disabled{opacity:.35;cursor:default}

.inv-grid{
	display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px;
}
.inv-cell{
	aspect-ratio:1;background:var(--slot-bg);border:2px solid transparent;
	border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
	position:relative;cursor:pointer;transition:background .15s,border-color .15s,transform .15s;
	overflow:hidden;
}
.inv-cell:hover{background:var(--slot-hover);transform:scale(1.04)}
.inv-cell.selected{border-color:var(--accent);background:rgba(108,92,231,.15)}
.inv-cell .cell-icon{font-size:28px;pointer-events:none}
.inv-cell .cell-name{font-size:10px;text-align:center;margin-top:2px;opacity:.85;pointer-events:none;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.inv-cell .cell-qty{
	position:absolute;bottom:3px;right:5px;font-size:10px;font-weight:700;
	color:var(--gold);pointer-events:none;
}
.inv-cell[data-rarity=common]{border-color:var(--rarity-common)}
.inv-cell[data-rarity=uncommon]{border-color:var(--rarity-uncommon)}
.inv-cell[data-rarity=rare]{border-color:var(--rarity-rare)}
.inv-cell[data-rarity=epic]{border-color:var(--rarity-epic)}
.inv-cell[data-rarity=legendary]{border-color:var(--rarity-legendary)}
.inv-cell[data-rarity=mythical]{border-color:var(--rarity-mythical);box-shadow:0 0 8px rgba(204,68,255,0.4)}
.inv-cell[data-rarity=mythic]{border-color:var(--rarity-mythic);box-shadow:0 0 10px rgba(255,215,0,0.5),0 0 20px rgba(255,215,0,0.2)}
.inv-cell[data-rarity=pink]{border-color:var(--rarity-pink);box-shadow:0 0 8px rgba(255,78,196,0.5)}
.inv-cell[data-rarity=cursed]{border-color:var(--rarity-cursed);box-shadow:0 0 10px rgba(192,57,43,0.45)}
.inv-cell[data-rarity=corrupted]{border-color:var(--rarity-corrupted);box-shadow:0 0 10px rgba(192,57,43,0.45)}
.inv-cell[data-rarity=nightmare]{border-color:var(--rarity-nightmare);box-shadow:0 0 12px rgba(224,112,255,0.55),0 0 22px rgba(80,0,80,0.4)}
.inv-cell[data-gem-perfect=1]{border-color:#ffd24a;box-shadow:0 0 12px rgba(255,210,74,.85),0 0 3px #fff inset}
.inv-cell[data-variant=1]{outline:1px solid rgba(126,203,255,0.7)}
.inv-cell[data-corrupt="1"]{background:#4a1214}
.inv-cell[data-corrupt="1"]:hover{background:#5c181c}
.inv-cell[data-nightmare="1"]{background:#2a1038}
.inv-cell[data-nightmare="1"]:hover{background:#3a1648}
.equip-slot[data-corrupt="1"]{background:#4a1214}
.equip-slot[data-nightmare="1"]{background:#2a1038}
.inv-cell .cell-badge{position:absolute;top:2px;left:3px;font-size:9px;pointer-events:none;text-shadow:0 0 4px #000}

/* item tooltip */
.tooltip{
	position:fixed;z-index:1000;max-width:240px;padding:10px 14px;
	background:#1c1a30;border:1px solid var(--border);border-radius:8px;
	pointer-events:none;font-size:12px;line-height:1.45;
	box-shadow:0 6px 20px rgba(0,0,0,.6);display:none;
}
.tooltip .tt-name{font-size:14px;font-weight:700;margin-bottom:3px}
.tooltip .tt-type{font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:capitalize}
.tooltip .tt-stat{color:var(--green)}
.tooltip .tt-desc{color:var(--muted);margin-top:4px;font-style:italic}

/* ============================================================
   SPELL SLOTS (right col)
   ============================================================ */
.spell-slot{
	display:flex;align-items:center;gap:10px;padding:8px 10px;
	background:var(--slot-bg);border:1px solid var(--border);border-radius:8px;
	min-height:48px;cursor:pointer;transition:background .2s,border-color .2s;
}
.spell-slot:hover{background:var(--slot-hover);border-color:rgba(255,255,255,.3)}
.spell-slot .sp-num{font-size:11px;color:var(--muted);min-width:14px}
.spell-slot .sp-color{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.spell-slot .sp-name{font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spell-slot .sp-mana{font-size:11px;color:var(--blue)}
.spell-slot .sp-empty{font-size:12px;color:var(--muted);font-style:italic}
.ultimate-slot{border-color:rgba(255,170,0,.4);background:rgba(255,170,0,.08)}
.ultimate-slot:hover{border-color:rgba(255,170,0,.6);background:rgba(255,170,0,.15)}
.ultimate-slot .sp-mana{color:#ffaa00}

/* ============================================================
   SPELL BUILDER MODAL
   ============================================================ */
.modal-overlay{
	position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;
	display:none;align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex}
.modal{
	width:min(96vw,1100px);max-height:92vh;background:#181630;
	border:1px solid var(--border);border-radius:12px;overflow:hidden;
	display:flex;flex-direction:column;
}
.modal-head{
	display:flex;align-items:center;justify-content:space-between;
	padding:12px 18px;background:rgba(0,0,0,.3);border-bottom:1px solid var(--border);
}
.modal-head h2{font-size:17px}
.modal-head .close-btn{
	background:none;border:none;color:var(--red);font-size:22px;
	line-height:1;transition:opacity .2s;opacity:.7;
}
.modal-head .close-btn:hover{opacity:1}

.modal-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}

/* spell meta row */
.spell-meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.spell-meta label{font-size:12px;color:var(--muted)}
.spell-meta input[type=text]{
	padding:5px 10px;font-size:14px;background:rgba(255,255,255,.07);
	border:1px solid var(--border);border-radius:5px;color:#fff;width:200px;
}
.spell-meta .meta-chip{
	padding:4px 10px;border-radius:5px;font-size:12px;
	background:rgba(255,255,255,.06);border:1px solid var(--border);
}
.spell-meta .meta-chip b{color:#fff}

/* spell description (auto-generated) */
.spell-desc{
	padding:8px 12px;background:rgba(108,92,231,.08);border:1px solid rgba(108,92,231,.2);
	border-radius:6px;font-size:12px;color:var(--muted);line-height:1.5;
	font-style:italic;min-height:36px;
}

/* phases container */
.phases-wrap{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.phase-card{
	min-width:260px;max-width:280px;flex-shrink:0;background:var(--panel2);
	border:1px solid var(--border);border-radius:8px;padding:12px;
	display:flex;flex-direction:column;gap:8px;position:relative;
}
.phase-card h4{font-size:13px;color:var(--accent2);display:flex;align-items:center;justify-content:space-between}
.phase-card h4 .remove-phase{
	background:none;border:none;color:var(--red);font-size:14px;opacity:.6;cursor:pointer;
}
.phase-card h4 .remove-phase:hover{opacity:1}

.phase-card .arrow-between{
	position:absolute;top:50%;right:-20px;color:var(--accent);font-size:20px;
	transform:translateY(-50%);pointer-events:none;
}

/* form rows inside phase card */
.prow{display:flex;flex-direction:column;gap:3px}
.prow label{font-size:11px;color:var(--muted)}
.prow select,.prow input[type=range],.prow input[type=number],.prow input[type=color]{
	width:100%;font-size:12px;padding:4px 6px;
	background:#1c1a30;border:1px solid var(--border);border-radius:4px;
	color:#e8eaff;color-scheme:dark;
}
.prow input[type=range]{padding:2px 0;cursor:pointer}
.prow input[type=color]{height:28px;padding:2px;cursor:pointer}
.prow select option,.prow select optgroup{
	background:#1c1a30;color:#e8eaff;padding:6px 8px;
}
.prow select:focus{border-color:var(--accent);outline:none}
.prow select{cursor:pointer}
.prow .range-row{display:flex;align-items:center;gap:6px}
.prow .range-val{font-size:11px;min-width:28px;text-align:right;color:#fff}

/* effects checkboxes */
.fx-grid{display:flex;flex-wrap:wrap;gap:4px}
.fx-chip{
	padding:3px 8px;font-size:11px;border-radius:4px;
	background:rgba(255,255,255,.06);border:1px solid var(--border);
	cursor:pointer;transition:background .15s,border-color .15s;user-select:none;
}
.fx-chip.active{background:rgba(108,92,231,.25);border-color:var(--accent)}
.fx-chip.blocked{opacity:0.35;cursor:not-allowed;text-decoration:line-through}

/* add phase button */
.add-phase-btn{
	min-width:80px;align-self:center;padding:10px 16px;font-size:13px;
	background:rgba(108,92,231,.15);border:2px dashed var(--accent);border-radius:8px;
	color:var(--accent2);transition:background .2s;flex-shrink:0;
}
.add-phase-btn:hover{background:rgba(108,92,231,.3)}

/* modal footer */
.modal-foot{
	display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;
	border-top:1px solid var(--border);background:rgba(0,0,0,.2);
}
.btn{padding:8px 20px;font-size:13px;border:none;border-radius:6px;transition:background .2s,transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#7c6cf0}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#c0392b}
.btn-ghost{background:rgba(255,255,255,.08);color:#ccc;border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,.15)}

/* context menu for inventory (equip / use) */
.ctx-menu{
	position:fixed;z-index:600;background:#1c1a30;border:1px solid var(--border);
	border-radius:6px;overflow:hidden;min-width:140px;box-shadow:0 4px 16px rgba(0,0,0,.6);
	display:none;
}
.ctx-menu.open{display:block}
.ctx-item{
	padding:8px 14px;font-size:13px;cursor:pointer;transition:background .15s;
}
.ctx-item:hover{background:rgba(108,92,231,.2)}

/* scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}

/* ============================================================
   TABS
   ============================================================ */
.tab-btn{
	padding:8px 18px;font-size:13px;font-weight:600;
	background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:6px 6px 0 0;
	color:var(--muted);cursor:pointer;transition:background .2s,color .2s;
}
.tab-btn.active{background:var(--panel);color:var(--accent2);border-bottom-color:transparent}
.tab-btn:hover:not(.active){background:rgba(255,255,255,.1)}

/* ============================================================
   SPELL DICTIONARY
   ============================================================ */
.dict-cat-btn{
	padding:6px 14px;font-size:12px;font-weight:600;
	background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:6px;
	color:var(--muted);cursor:pointer;transition:background .2s,color .2s;
}
.dict-cat-btn.active{background:var(--accent2);color:#111;border-color:var(--accent2)}
.dict-cat-btn:hover:not(.active){background:rgba(255,255,255,.12)}
.dict-card{
	background:var(--slot-bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;
}
.dict-card h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px}
.dict-card .dict-tags{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.dict-tag{
	padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;
	background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
}
.dict-tag.mana{color:#5dade2;border-color:rgba(93,173,226,.3)}
.dict-tag.ctrl{color:#f39c12;border-color:rgba(243,156,18,.3)}
.dict-tag.rank{color:#8e44ad;border-color:rgba(142,68,173,.3)}
.dict-tag.dmg-up{color:#2ecc71;border-color:rgba(46,204,113,.3)}
.dict-tag.dmg-down{color:#e74c3c;border-color:rgba(231,76,60,.3)}
.dict-tag.ult{color:#ffcc00;border-color:rgba(255,204,0,.3);background:rgba(255,204,0,.1)}
.dict-detail{font-size:12px;color:var(--muted);line-height:1.5;margin:4px 0}
.dict-detail b{color:#ddd}
.dict-section-title{font-size:16px;font-weight:700;color:var(--accent2);margin:8px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--border)}

/* ============================================================
   CRAFTING
   ============================================================ */
.craft-card{
	display:flex;align-items:center;gap:12px;padding:10px 14px;
	background:var(--slot-bg);border:1px solid var(--border);border-radius:8px;
	transition:background .15s;
}
.craft-card:hover{background:var(--slot-hover)}
.craft-icon{font-size:28px;width:40px;text-align:center;flex-shrink:0}
.craft-info{flex:1;display:flex;flex-direction:column;gap:3px}
.craft-name{font-size:14px;font-weight:700}
.craft-name[data-rarity=common]{color:var(--rarity-common)}
.craft-name[data-rarity=uncommon]{color:var(--rarity-uncommon)}
.craft-name[data-rarity=rare]{color:var(--rarity-rare)}
.craft-name[data-rarity=epic]{color:var(--rarity-epic)}
.craft-name[data-rarity=legendary]{color:var(--rarity-legendary)}
.craft-name[data-rarity=mythical]{color:var(--rarity-mythical);text-shadow:0 0 6px rgba(204,68,255,0.5)}
.craft-name[data-rarity=pink]{color:var(--rarity-pink);text-shadow:0 0 6px rgba(255,78,196,0.5)}
.craft-name[data-rarity=cursed]{color:var(--rarity-cursed)}
.craft-name[data-rarity=corrupted]{color:var(--rarity-corrupted)}
.craft-name[data-rarity=nightmare]{color:var(--rarity-nightmare)}

#inspectOverlay{
	position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:800;
	display:none;align-items:center;justify-content:center;
}
#inspectOverlay.open{display:flex}
#inspectCard{
	width:min(560px,92vw);max-height:86vh;overflow:auto;
	background:#161428;border:1px solid var(--border);border-radius:12px;padding:18px;
	box-shadow:0 12px 40px rgba(0,0,0,.6);
}
#inspectCard.wide{width:min(980px,96vw)}
.insp-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.insp-icon{font-size:36px}
.insp-name{font-size:18px;font-weight:800}
.insp-type{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.insp-block{margin:10px 0;padding:8px 10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px}
.insp-block.variant{border-color:rgba(126,203,255,.35)}
.insp-block.corruption{border-color:rgba(192,57,43,.45)}
.insp-block.combo{border-color:rgba(224,112,255,.4);background:rgba(224,112,255,.06)}
.insp-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--accent2);margin-bottom:4px}
.insp-stat,.insp-body{font-size:13px;line-height:1.45}
.insp-body.drawback{color:#ff8b8b;margin-top:4px}
.insp-gem{padding:6px 8px;border-radius:6px;border:1px dashed rgba(255,255,255,.15);margin-top:6px;cursor:pointer;font-size:13px}
.insp-gem.filled{border-style:solid;border-color:rgba(154,173,221,.4);background:rgba(154,173,221,.08)}
.insp-gem.empty{color:var(--muted)}
.insp-sub{font-size:11px;color:var(--muted);margin-top:2px}
.insp-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.col-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.col-toolbar .btn{padding:7px 12px;font-size:12px;font-weight:700;border-radius:7px;border:1px solid var(--border);cursor:pointer;background:rgba(255,255,255,.06);color:#fff}
.col-toolbar .btn-unlock{border-color:#f3c15a;color:#f3c15a;background:rgba(243,193,90,.12)}
.col-toolbar .btn-prune{border-color:#c0392b;color:#ff8b8b;background:rgba(192,57,43,.12)}
.col-dungeon{margin-bottom:16px}
.col-grid{display:flex;flex-wrap:wrap;gap:10px}
.col-item{
	width:118px;min-height:108px;padding:8px 8px 10px;border:2px solid rgba(255,255,255,.10);
	border-radius:10px;background:rgba(255,255,255,.03);display:flex;flex-direction:column;
	align-items:center;justify-content:center;text-align:center;gap:4px;box-sizing:border-box;
}
.col-item .col-ico{font-size:26px;line-height:1}
.col-item .col-name{font-size:11px;font-weight:700;line-height:1.25}
.col-item.found{cursor:pointer}
.col-item.found:hover{background:rgba(255,255,255,.07)}
.col-item .undiscovered{opacity:.45;letter-spacing:1px}
.col-item.tier-gold{
	border:3px solid #ffd24a;
	box-shadow:0 0 14px rgba(255,210,74,.85), 0 0 3px #fff inset;
	animation:colShineGold 1.8s linear infinite;
}
.col-item.tier-red{
	border:3px solid #ff3b3b;
	box-shadow:0 0 16px rgba(255,59,59,.9), 0 0 3px #fff inset;
	animation:colShineRed 1.8s linear infinite;
}
.col-item.tier-purple{
	border:3px solid #c44dff;
	box-shadow:0 0 18px rgba(196,77,255,.95), 0 0 3px #fff inset;
	animation:colShinePurple 1.8s linear infinite;
}
@keyframes colShineGold{0%,100%{box-shadow:0 0 10px rgba(255,210,74,.7),0 0 2px #fff inset}50%{box-shadow:0 0 22px rgba(255,236,150,1),0 0 6px #fff inset}}
@keyframes colShineRed{0%,100%{box-shadow:0 0 10px rgba(255,59,59,.7),0 0 2px #fff inset}50%{box-shadow:0 0 24px rgba(255,120,120,1),0 0 6px #fff inset}}
@keyframes colShinePurple{0%,100%{box-shadow:0 0 12px rgba(196,77,255,.75),0 0 2px #fff inset}50%{box-shadow:0 0 26px rgba(230,160,255,1),0 0 6px #fff inset}}
.col-insp{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px;align-items:start}
.col-insp-main{display:flex;flex-direction:column;gap:8px;min-width:0}
.col-insp-loc{border-radius:12px;min-height:260px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(255,255,255,.12);position:relative;overflow:hidden}
.col-insp-loc .col-loc-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.75}
.col-insp-loc .col-loc-name{font-size:15px;font-weight:800;margin:4px 0 10px}
.col-insp-loc .col-loc-icon{font-size:52px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.col-insp-loc .col-loc-blurb{font-size:12px;opacity:.85;margin-top:10px;line-height:1.4}
.col-insp-loc.scene-fire{background:radial-gradient(circle at 50% 80%,#ff7a1a 0%,#6a1408 42%,#1a0704 100%)}
.col-insp-loc.scene-ice{background:radial-gradient(circle at 50% 80%,#b8e8ff 0%,#245a88 45%,#071018 100%)}
.col-insp-loc.scene-jungle{background:radial-gradient(circle at 50% 80%,#7cff9a 0%,#145a28 45%,#061208 100%)}
.col-insp-loc.scene-mythic{background:radial-gradient(circle at 50% 80%,#ffe27a 0%,#6a3aa0 45%,#12081c 100%)}
.col-stat-row{display:flex;gap:8px;width:100%;flex-wrap:nowrap}
.col-stat-chip{flex:1;min-width:0;padding:8px 8px;border:1px solid;border-radius:8px;background:rgba(0,0,0,.28);display:flex;flex-direction:column;gap:2px;font-size:11px}
.col-stat-chip b{font-size:16px}
.col-var-row,.col-mode-row,.col-corr-picks{display:flex;flex-wrap:wrap;gap:6px}
.col-mode-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.col-var-ico,.col-mode,.col-corr-chip{
	border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#ddd;
	border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer;
}
.col-var-ico.on{border-color:#7ecbff;color:#7ecbff;box-shadow:0 0 8px rgba(126,203,255,.45)}
.col-mode.on{border-color:#f0c060;color:#f0c060;box-shadow:0 0 8px rgba(240,192,96,.4)}
.col-mode.corr.on{border-color:#ff5a4a;color:#ff8b8b;box-shadow:0 0 8px rgba(255,90,74,.45)}
.col-mode.nm.on{border-color:#c44dff;color:#e070ff;box-shadow:0 0 8px rgba(196,77,255,.5)}
.col-corr-chip.on{border-color:#ff8b8b;color:#fff}
.col-var-ico.locked,.col-mode.locked{opacity:.35;cursor:not-allowed}
.insp-changed{color:#7ecbff;font-weight:800;text-shadow:0 0 8px rgba(126,203,255,.55)}
.col-corr-num-list{margin:6px 0 0 18px;padding:0;color:#e8d48a}
.col-corr-num-list li{margin:3px 0}
@media (max-width:720px){
	.col-insp{grid-template-columns:1fr}
	.col-mode-row{grid-template-columns:1fr}
}
.craft-desc{font-size:11px;color:var(--muted);font-style:italic}
.craft-ingredients{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.craft-ing{
	display:flex;align-items:center;gap:3px;padding:2px 7px;
	font-size:11px;border-radius:4px;
	background:rgba(255,255,255,.06);border:1px solid var(--border);
}
.craft-ing.has{color:var(--green);border-color:rgba(40,167,69,.4)}
.craft-ing.missing{color:var(--red);border-color:rgba(231,76,60,.4)}
.craft-btn{
	padding:8px 16px;font-size:12px;font-weight:700;border:none;border-radius:6px;
	background:var(--accent);color:#fff;cursor:pointer;transition:background .2s,opacity .2s;
	flex-shrink:0;
}
.craft-btn:hover:not(:disabled){background:#7c6cf0}
.craft-btn:disabled{opacity:.35;cursor:not-allowed}

@keyframes fadeUp{
	0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
	100%{opacity:0;transform:translate(-50%,-80%) scale(1.1)}
}
.st-chapter{margin-bottom:6px}
.st-chapter-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;border:1px solid rgba(204,102,68,0.25);background:rgba(204,102,68,0.08);cursor:pointer;user-select:none;transition:background .15s}
.st-chapter-head:hover{background:rgba(204,102,68,0.16)}
.st-chapter-head .st-arrow{transition:transform .2s;font-size:10px;color:#cc6644}
.st-chapter-head.open .st-arrow{transform:rotate(90deg)}
.st-chapter-head .st-ch-title{flex:1;font-size:13px;font-weight:bold;color:#cc6644}
.st-chapter-head .st-ch-prog{font-size:11px;color:var(--muted)}
.st-chapter-body{display:none;padding:4px 0 0 18px}
.st-chapter-head.open+.st-chapter-body{display:block}
.st-chapter.all-done .st-chapter-head{border-color:rgba(40,167,69,0.3);background:rgba(40,167,69,0.06)}
.st-chapter.all-done .st-ch-title{color:#28a745}
.st-chapter.all-done .st-arrow{color:#28a745}

#bestiaryPopupCard{width:min(96vw,820px);height:min(90vh,520px);background:#12101e;border:1px solid rgba(255,255,255,.15);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.9)}
#bpHeader{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:rgba(0,0,0,.35);border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}

#bpRight{flex:1;position:relative;overflow:hidden;background:#000}

.bp-section-lbl{font-size:10px;color:var(--accent2);font-weight:bold;text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px}
.bp-stat-row{display:flex;flex-direction:column;gap:2px}
.bp-stat-row .bp-stat-header{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.bp-bar-bg{width:100%;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.bp-bar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.bp-drop-item{display:flex;align-items:center;gap:6px;padding:4px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:5px;font-size:12px}

<div id="versionBadge" style="position:fixed;left:8px;bottom:6px;z-index:99999;font:11px/1.2 monospace;color:rgba(255,255,255,0.5);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,0.85);user-select:none;">v1.0.0</div>

<!-- ==================== TOP BAR ==================== -->
<div id="topBar">
	<button id="backBtn" onclick="location.href='index.html'">← Menu</button>
	<h1>Inventory</h1>
	<div class="stats-bar" id="statsBar"></div>
</div>

<!-- ==================== MAIN LAYOUT ==================== -->
<div id="mainWrap">

	<!-- LEFT: Equipment -->
	<div id="leftCol">
		<div class="panel">
			<h3>Equipment</h3>
			<div id="equipSlots" style="display:flex;flex-direction:column;gap:8px"></div>
		</div>
		<div class="panel">
			<h3>Base Stats</h3>
			<div id="baseStatsPanel" style="font-size:12px;line-height:1.8;color:var(--muted)"></div>
		</div>
	</div>

	<!-- CENTER: Inventory Grid + Crafting -->
	<div id="centerCol">
		<!-- Tab bar -->
		<div style="display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap">
			<button class="tab-btn active" data-tab="inventory" onclick="switchTab('inventory')">📦 Inventory</button>
			<button class="tab-btn" data-tab="collection" onclick="switchTab('collection')">📖 Collection</button>
			<button class="tab-btn" data-tab="crafting" onclick="switchTab('crafting')">🔨 Crafting</button>
			<button class="tab-btn" data-tab="quests" onclick="switchTab('quests')" style="display:none">🗺️ Quests</button>
			<button class="tab-btn" data-tab="bestiary" onclick="switchTab('bestiary')">📖 Bestiary</button>
			<button class="tab-btn" data-tab="dictionary" onclick="switchTab('dictionary')">📚 Spell Dictionary</button>
		</div>

		<!-- Inventory Tab -->
		<div id="inventoryTab" class="panel" style="flex:1;display:flex;flex-direction:column">
			<h3>Inventory</h3>
			<div class="inv-toolbar">
				<input type="text" id="searchBox" placeholder="Search items..." autocomplete="off"/>
				<button class="inv-page-btn" id="prevPage">◀</button>
				<span class="inv-page-info" id="pageInfo">1 / 1</span>
				<button class="inv-page-btn" id="nextPage">▶</button>
				<button class="inv-page-btn" id="testBtn" style="margin-left:auto;padding:4px 12px;background:rgba(243,156,18,.25);border-color:var(--rarity-legendary);color:var(--rarity-legendary);font-size:11px;border-radius:5px" title="Clear inventory and give one of every item">🧪 Test All</button>
			</div>
			<div class="inv-grid" id="invGrid"></div>
		</div>

		<!-- Crafting Tab -->
		<div id="craftingTab" class="panel" style="flex:1;display:none;flex-direction:column;overflow-y:auto">
			<h3>Crafting</h3>
			<div class="inv-toolbar" style="margin-bottom:8px">
				<input type="text" id="craftSearchBox" placeholder="Search recipes..." autocomplete="off"/>
				<select id="craftFilter" style="padding:6px 10px;font-size:12px;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:6px;color:#fff">
					<option value="all">All Types</option>
					<option value="staff">Staves</option>
					<option value="robe">Robes</option>
					<option value="relic">Relics</option>
				</select>
			</div>
			<div id="craftList" style="display:flex;flex-direction:column;gap:8px"></div>
		</div>

		<!-- Collection Tab -->
		<div id="collectionTab" class="panel" style="flex:1;display:none;flex-direction:column;overflow-y:auto">
			<h3>Gear Collection</h3>
			<div class="col-toolbar">
				<button type="button" class="btn btn-unlock" id="colUnlockAll">Unlock all entries</button>
				<button type="button" class="btn btn-prune" id="colPruneOwned">Keep only items I own</button>
			</div>
			<div id="collectionList"></div>
		</div>

		<!-- Quest Tab -->
		<div id="questTab" class="panel" style="flex:1;display:none;flex-direction:column">
			<h3>Quests</h3>
			<div id="questList"></div>
		</div>

		<!-- Bestiary Tab -->
		<div id="bestiaryTab" class="panel" style="flex:1;display:none;flex-direction:column;overflow-y:auto">
			<h3>Bestiary <span id="bestiaryCount" style="font-size:12px;color:var(--muted);font-weight:normal"></span></h3>
			<div id="bestiaryList" style="display:flex;flex-direction:column;gap:6px"></div>
		</div>

		<!-- Spell Dictionary Tab -->
		<div id="dictionaryTab" class="panel" style="flex:1;display:none;flex-direction:column;overflow-y:auto">
			<h3>📚 Spell Dictionary</h3>
			<div class="dict-toolbar" style="display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap">
				<button class="dict-cat-btn active" data-cat="shapes" onclick="renderDictSection('shapes')">🔷 Shapes</button>
				<button class="dict-cat-btn" data-cat="behaviors" onclick="renderDictSection('behaviors')">🎯 Behaviors</button>
				<button class="dict-cat-btn" data-cat="effects" onclick="renderDictSection('effects')">✨ Effects</button>
				<button class="dict-cat-btn" data-cat="domains" onclick="renderDictSection('domains')">⚡ Domains</button>
				<button class="dict-cat-btn" data-cat="ultimates" onclick="renderDictSection('ultimates')">🌟 Ultimates</button>
				<button class="dict-cat-btn" data-cat="phases" onclick="renderDictSection('phases')">🔗 Phases &amp; Triggers</button>
			<button class="dict-cat-btn" data-cat="classes" onclick="renderDictSection('classes')">🧙 Classes</button>
			</div>
			<div id="dictContent" style="display:flex;flex-direction:column;gap:8px"></div>
		</div>
	</div>

	<!-- RIGHT: Spell Slots -->
	<div id="rightCol">
		<div class="panel" style="flex:1;display:flex;flex-direction:column;gap:8px">
			<div style="display:flex;align-items:center;gap:8px">
				<h3 style="flex:1">Spell Loadout <span style="font-size:11px;color:var(--muted);text-transform:none">(click to edit)</span></h3>
				<button class="btn btn-ghost" id="loadoutMgrBtn" style="font-size:.8em;padding:3px 10px" title="Manage saved spell loadouts">📦 Loadouts</button>
			</div>
			<div id="spellSlots" style="display:flex;flex-direction:column;gap:6px"></div>
		</div>
		<div class="panel" style="margin-top:8px">
			<h3>Vows <span style="font-size:11px;color:var(--muted);text-transform:none">(sacrifice for power)</span></h3>
			<div id="vowSlots" style="display:flex;flex-direction:column;gap:6px"></div>
		</div>
	</div>
</div>

/* Build reverse lookup: which items boost each shape/behavior/effect */
const SHAPE_BOOST_ITEMS = {};  // shape key -> [{ itemId, boost }]
const BEH_BOOST_ITEMS = {};    // behavior key -> [{ itemId, boost }]
const EFFECT_BOOST_ITEMS = {}; // effect key -> [{ itemId, boost }]
for(const [itemId, data] of Object.entries(ITEM_BOOSTS)){
	for(const sh of (data.shapes||[])){
		if(!SHAPE_BOOST_ITEMS[sh]) SHAPE_BOOST_ITEMS[sh] = [];
		SHAPE_BOOST_ITEMS[sh].push({ itemId, boost: data.boost });
	}
	for(const bh of (data.behaviors||[])){
		if(!BEH_BOOST_ITEMS[bh]) BEH_BOOST_ITEMS[bh] = [];
		BEH_BOOST_ITEMS[bh].push({ itemId, boost: data.boost });
	}
	for(const fx of (data.effects||[])){
		if(!EFFECT_BOOST_ITEMS[fx]) EFFECT_BOOST_ITEMS[fx] = [];
		EFFECT_BOOST_ITEMS[fx].push({ itemId, boost: data.boost });
	}
}

/* Check if player has an item equipped (in any slot) */
function hasItemEquipped(itemId){
	if(typeof GearSystem !== 'undefined') return GearSystem.hasEquipped(STATE.equipment, itemId);
	for(const slotKey of ['staff','robe','relic1','relic2']){
		const v = STATE.equipment[slotKey];
		if(v === itemId || (v && v.itemId === itemId)) return true;
	}
	return false;
}

/* Calculate total boost for a spell based on equipped items */
function getSpellBoost(spell){
	if(spell && spell.nodes && typeof GearRuntime !== 'undefined' && GearRuntime.runeItemBoost) return GearRuntime.runeItemBoost(spell, STATE.equipment);
	let totalBoost = 1.0;
	const checked = new Set();
	
	// Iterate through all phases of the spell
	const phases = spell.phases || [];
	for(const phase of phases){
		// Check shape boosts
		if(phase.shape && SHAPE_BOOST_ITEMS[phase.shape]){
			for(const item of SHAPE_BOOST_ITEMS[phase.shape]){
				if(!checked.has(item.itemId) && hasItemEquipped(item.itemId)){
					totalBoost *= item.boost;
					checked.add(item.itemId);
				}
			}
		}
		
		// Check behavior boosts
		if(phase.behavior && BEH_BOOST_ITEMS[phase.behavior]){
			for(const item of BEH_BOOST_ITEMS[phase.behavior]){
				if(!checked.has(item.itemId) && hasItemEquipped(item.itemId)){
					totalBoost *= item.boost;
					checked.add(item.itemId);
				}
			}
		}
		
		// Check effect boosts
		for(const fx of (phase.effects || [])){
			if(EFFECT_BOOST_ITEMS[fx]){
				for(const item of EFFECT_BOOST_ITEMS[fx]){
					if(!checked.has(item.itemId) && hasItemEquipped(item.itemId)){
						totalBoost *= item.boost;
						checked.add(item.itemId);
					}
				}
			}
		}
	}
	
	return totalBoost;
}

/* Check if a shape/behavior/effect is unlocked — ALL UNLOCKED BY DEFAULT */
function getVowUnlocks(){
	const unlocks = new Set();
	for(const v of STATE.vows){
		if(!v || !v.vowUnlocks) continue;
		for(const u of v.vowUnlocks) unlocks.add(u);
	}
	return unlocks;
}

/* The old phase-based spell crafter is gone. Any non-rune spell left in a save
   (slots, loadouts, transformation slots) is removed; an empty spellbook gets the
   starter spell. */
function migrateToRuneMagic(s){
	if(typeof MagicEngine === 'undefined' || !s) return false;
	let changed = false;
	if(!s.magicProfile){ s.magicProfile = MagicEngine.defaultMagicProfile(); changed = true; }
	if(!s.spells) s.spells = new Array(10).fill(null);
	if(MagicEngine.sanitizeSlots(s.spells, { ensureStarter: true, dropItems: true })) changed = true;
	if(Array.isArray(s.transformSpells) && MagicEngine.sanitizeSlots(s.transformSpells, { dropItems: true })) changed = true;
	if(Array.isArray(s.loadouts)) for(const ld of s.loadouts){ if(ld && Array.isArray(ld.spells) && MagicEngine.sanitizeSlots(ld.spells, { dropItems: true })) changed = true; }
	return changed;
}

function loadState(){
	try {
		const raw = localStorage.getItem('magicBattle_playerData');
		if(raw){
			const s = JSON.parse(raw);
			// ensure arrays are correct length
			if(!s.spells || s.spells.length < 10) s.spells = (s.spells||[]).concat(new Array(10).fill(null)).slice(0,10);
			if(!s.vows) s.vows = [null, null, null];
			if(s.domainVow === undefined) s.domainVow = null;
			if(s.mageRank == null) s.mageRank = 0;
			if(s.xp == null) s.xp = 0;
			if(!s.mageClass) s.mageClass = 'none';
			if(!s.mageClass2) s.mageClass2 = 'none';
			if(!s.loadouts) s.loadouts = [];
			if(s.activeLoadoutIdx == null) s.activeLoadoutIdx = -1;
			if(!s.transformSpells) s.transformSpells = new Array(10).fill(null);
			if(!s.equipment) s.equipment = { staff:null, robe:null, relic1:null, relic2:null };
			if(!s.baseStats) s.baseStats = { magicPower:10, magicControl:5, manaRegen:100, magicDefence:8 };
			if(!s.inventory) s.inventory = [];
			if(typeof ensurePlayerGold === 'function') ensurePlayerGold(s);
			else if(s.gold == null) s.gold = 350;
			migrateGearState(s);
			if(migrateToRuneMagic(s)){
				try { localStorage.setItem('magicBattle_playerData', JSON.stringify(s)); } catch(e){}
			}
			if(typeof enforceSpellRulesOnData === 'function' && enforceSpellRulesOnData(s)){
				try { localStorage.setItem('magicBattle_playerData', JSON.stringify(s)); } catch(e){}
			}
			return s;
		}
	} catch(e){}
	const s = defaultPlayerState();
	s.spells[0] = makeDefaultSpell();
	s.magicProfile = MagicEngine.defaultMagicProfile();
	migrateGearState(s);
	return s;
}

function migrateGearState(s){
	if(!s.equipment) s.equipment = { staff:null, robe:null, relic1:null, relic2:null };
	if(!s.gearCollection && typeof GearSystem !== 'undefined') s.gearCollection = GearSystem.defaultCollection();
	else if(!s.gearCollection) s.gearCollection = { items:{}, variants:{}, corruptions:{}, nightmare:{}, gems:{} };
	const keep = (id) => !!(ITEM_DB[id]);
	for(const slot of ['staff','robe','relic1','relic2']){
		const v = s.equipment[slot];
		if(!v) continue;
		if(typeof v === 'string'){
			if(!keep(v)){ s.equipment[slot] = null; continue; }
			if(typeof GearSystem !== 'undefined' && GearSystem.isGear(v)){
				s.equipment[slot] = GearSystem.createInstance(v);
				GearSystem.discover(s, s.equipment[slot]);
			}
		} else if(v.itemId && !keep(v.itemId)){
			s.equipment[slot] = null;
		} else if(v.itemId && typeof GearSystem !== 'undefined'){
			GearSystem.discover(s, v);
		}
	}
	s.inventory = (s.inventory || []).filter(e => e && keep(e.itemId)).map(e => {
		if(typeof GearSystem !== 'undefined' && GearSystem.isGear(e.itemId) && !e.uid){
			const inst = GearSystem.createInstance(e.itemId, e);
			GearSystem.discover(s, inst);
			return inst;
		}
		if(typeof GearSystem !== 'undefined' && e.uid) GearSystem.discover(s, e);
		if(typeof GearSystem !== 'undefined' && GearSystem.isGem(e.itemId)) GearSystem.discoverGem(s, e.itemId, e.quality);
		return e;
	});
}

/* Calculate and update spell boosts based on equipped items */
function updateSpellBoosts(){
	if(!STATE.spellBoosts) STATE.spellBoosts = [];
	for(let i=0; i<10; i++){
		const spell = STATE.spells[i];
		if(!spell || ((!spell.phases || !spell.phases.length) && !spell.nodes)){
			STATE.spellBoosts[i] = 1.0;
			continue;
		}
		STATE.spellBoosts[i] = getSpellBoost(spell);
	}
}

function saveState(){
	updateSpellBoosts();
	if(typeof enforceSpellRulesOnData === 'function') enforceSpellRulesOnData(STATE);
	localStorage.setItem('magicBattle_playerData', JSON.stringify(STATE));
}

function applyLoadoutExtras(ld){

	if(ld.mageClass != null) STATE.mageClass = ld.mageClass;

			// also sync transformSpells if transformation loadout
			if(ld.type === 'transformation') STATE.transformSpells = JSON.parse(JSON.stringify(ld.spells));
			STATE.activeLoadoutIdx = idx;
			applyLoadoutExtras(ld);
			saveState(); renderSpellSlots(); renderLoadoutModal(); renderStats(); renderVowSlots();
			notifyGameSpellsChanged();
		});
	});
	// Delete handlers
	body.querySelectorAll('.ld-delete').forEach(btn => {
		btn.addEventListener('click', () => {
			const idx = +btn.dataset.idx;
			// Protect last basic loadout
			if(STATE.loadouts[idx].type !== 'transformation'){
				const standardCount = STATE.loadouts.filter(l => l.type !== 'transformation').length;
				if(standardCount <= 1){ alert('You must keep at least one basic spell loadout!'); return; }
			}
			if(!confirm('Delete loadout "'+STATE.loadouts[idx].name+'"?')) return;
			STATE.loadouts.splice(idx, 1);
			if(STATE.activeLoadoutIdx >= STATE.loadouts.length) STATE.activeLoadoutIdx = STATE.loadouts.length - 1;
			saveState(); renderLoadoutModal();
		});
	});
}

function createNewLoadout(type){
	const name = prompt('Name this '+(type==='transformation'?'Transformation ':'')+'loadout:', type==='transformation'?'Transform Loadout '+(STATE.loadouts.filter(l=>l.type==='transformation').length+1):'Loadout '+(STATE.loadouts.length+1));
	if(!name) return;
	const copied = JSON.parse(JSON.stringify(STATE.spells || []));
	while(copied.length < 10) copied.push(null);
	copied.length = 10;
	const extras = snapshotLoadoutExtras();
	STATE.loadouts.push({ name: name.trim(), spells: copied, type, ...extras });
	STATE.activeLoadoutIdx = STATE.loadouts.length - 1;
	if(type === 'transformation') STATE.transformSpells = JSON.parse(JSON.stringify(copied));
	saveState(); renderLoadoutModal(); renderSpellSlots();
	notifyGameSpellsChanged();
}

/* =============================================================
   COMPUTED STATS (base + equipment)
   ============================================================= */
function computeStats(){
	if(!STATE.baseStats) STATE.baseStats = { magicPower:10, magicControl:5, manaRegen:100, magicDefence:8 };
	if(!STATE.equipment) STATE.equipment = { staff:null, robe:null, relic1:null, relic2:null };
	const s = {...STATE.baseStats};
	for(const slotKey of ['staff','robe','relic1','relic2']){
		const raw = STATE.equipment[slotKey];
		if(!raw) continue;
		if(typeof GearSystem !== 'undefined'){
			const inst = GearSystem.resolveEquip(raw);
			if(!inst) continue;
			const st = GearSystem.getInstanceStats(inst);
			for(const k in st) s[k] = (s[k]||0) + st[k];
			continue;
		}
		const id = typeof raw === 'string' ? raw : raw.itemId;
		const item = ITEM_DB[id];
		if(!item) continue;
		for(const k in item.stats) s[k] = (s[k]||0) + item.stats[k];
	}
	return s;
}

	domPlayerPower:  { label:'Weaken Self',        icon:'💔', desc:'Reduce player spell damage in domain (2 pts per 10%)', max:50, step:10, ptsPerStep:2 },
	domRange:        { label:'Compressed Domain',  icon:'📐', desc:'Reduce domain size (0.5 pts per 5%)', max:95, step:5, ptsPerStep:0.5 },

/* Points earned per sacrifice — vowIdx enables cumulative scaling across vows */
function calcVowPoints(vow, vowIdx){
	if(!vow) return 0;
	if(vow.sacrifice === 'health') return Math.floor(vow.amount / 5); // 5% = 1 point
	if(vow.sacrifice === 'maxMana'){
		// Scaling: more points the more you sacrifice, up to 40 at 1200
		const amt = vow.amount || 0;
		// Quadratic scaling: pts = 40 * (amt/1200)^1.5 roughly
		const ratio = amt / 1200;
		return Math.floor(40 * Math.pow(ratio, 1.3));
	}
	if(vow.sacrifice === 'effects'){
		// 0.5 pts per effect, 1 pt for elemental effects
		let pts = 0;
		for(const fx of (vow.sacrificedEffects||[])){
			const eff = EFFECTS[fx];
			pts += (eff && eff.category === 'elemental') ? 1 : 0.5;
		}
		return Math.floor(pts);
	}
	if(vow.sacrifice === 'shapes'){
		return (vow.sacrificedShapes||[]).length; // 1 pt per shape
	}
	if(vow.sacrifice === 'movement'){
		// 10% = 2 pts, 20% = 4 pts ... up to 50% = 10 pts
		return Math.floor((vow.amount || 0) / 5);
	}
	if(vow.sacrifice === 'visibility'){
		// 15% = 1 pt, 30% = 3 pts, 45% = 5 pts, 60% = 8 pts (scales slightly)
		const amt = vow.amount || 0;
		return Math.floor(amt / 15) + Math.floor(amt / 30);
	}
	if(vow.sacrifice === 'spellSlot'){
		let otherCount = 0;
		if(vowIdx != null){
			for(let i = 0; i < STATE.vows.length; i++){
				if(i === vowIdx) continue;
				const other = STATE.vows[i];
				if(other && other.sacrifice === 'spellSlot'){
					otherCount += (other.slots||[]).filter(s => s !== 9).length;
				}
			}
		}
		let pts = 0;
		const regularSlots = (vow.slots||[]).filter(s => s !== 9);
		const hasUlt = (vow.slots||[]).includes(9);
		const n = regularSlots.length;
		for(let i = 0; i < n; i++) pts += Math.max(1, otherCount + i);
		if(hasUlt) pts += 8;
		return pts;
	}
	if(vow.sacrifice === 'items'){
		const slots = vow.sacrificedItemSlots || [];
		const ITEM_PTS = [10, 15, 20, 30];
		// Count how many item slots are sacrificed across OTHER vows
		let otherCount = 0;
		if(vowIdx != null){
			for(let i = 0; i < STATE.vows.length; i++){
				if(i === vowIdx) continue;
				const other = STATE.vows[i];
				if(other && other.sacrifice === 'items') otherCount += (other.sacrificedItemSlots||[]).length;
			}
		}
		let pts = 0;
		for(let i = 0; i < slots.length; i++){
			const idx = otherCount + i;
			pts += idx < ITEM_PTS.length ? ITEM_PTS[idx] : 30;
		}
		return pts;
	}
	return 0;
}
function calcVowSpent(vow){
	if(!vow) return 0;
	let spent = 0;
	if(vow.boostType === 'dualClass'){
		spent += vow.secondClass ? 15 : 0;
	} else if(vow.boostAmount != null){
		spent += vow.boostAmount;
	} else if(vow.boosts){
		for(const k in vow.boosts) spent+=vow.boosts[k];
	}
	/* Each vow unlock costs 5 points */
	if(vow.vowUnlocks) spent += vow.vowUnlocks.length * 5;
	return spent;
}
function calcVowBoostsForSlot(slot){
	const globalBoosts = new Set(['maxHealth','jumpHeight','playerSpeed','defense','elementalDmg','critChance','spellVamp','thorns','manaEfficiency']);
	const b = {power:0,size:0,speed:0,count:0,duration:0,effects:0,phases:0,maxHealth:0,manaCost:0,cooldown:0,jumpHeight:0,playerSpeed:0,defense:0,elementalDmg:0,_sizeBonus:false};
	for(const v of STATE.vows){
		if(!v) continue;
		/* New format: single boostType + boostAmount */
		if(v.boostType != null){
			if(globalBoosts.has(v.boostType)){ b[v.boostType] = (b[v.boostType]||0) + (v.boostAmount||0); continue; }
			if(v.targetSlot !== slot) continue;
			b[v.boostType] = (b[v.boostType]||0) + (v.boostAmount||0);
			if(v.sizeBonus) b._sizeBonus = true;
		} else if(v.boosts){
			/* Legacy format */
			if(v.targetSlot !== slot) continue;
			for(const k in v.boosts) b[k] = (b[k]||0) + v.boosts[k];
		}
	}
	return b;
}

function inventoryManaOpts(slot, spell){
	const vb = calcVowBoostsForSlot(slot);
	return {
		stats: computeStats(),
		slotManaCost: vb.manaCost||0,
		manaEfficiency: vb.manaEfficiency||0,
		slot,
		isUltimate: !!(spell && spell.isUltimate && slot===9),
		mageClass: STATE.mageClass,
		mageClass2: STATE.mageClass2
	};
}

/* =============================================================
   RENDER: STATS BAR (top)
   ============================================================= */
/* what your stats do to rune spells (the same numbers the dungeon uses) */
function runeStatSummary(s){
	let prof = null; try { prof = magicProfileFor(); } catch(e){}
	const dmg = Math.max(0.25, (1 + (s.magicPower || 0) * 0.08) / 1.8);
	const ward = Math.max(0.5, Math.min(1.1, 1 / (1 + ((s.magicDefence || 0) - 8) * 0.015)));
	const lines = [
		'⚔️ Rune damage <b style="color:#e74c3c">×' + dmg.toFixed(2) + '</b>' + (prof ? ' · Max Output <b>' + prof.maxOutput + ' E</b>' : ''),
		prof ? '🎯 Rune capacity <b style="color:#9b59b6">' + prof.runeCapacity + '</b> · Zones up to <b>' + Math.round(prof.zoneRadiusMax || 0) + ' px</b>' : '',
		'🛡️ Enemy magic <b style="color:#2ecc71">' + (Math.abs(ward - 1) < 0.005 ? '±0' : ward < 1 ? '−' + Math.round((1 - ward) * 100) : '+' + Math.round((ward - 1) * 100)) + '%</b> · +' + Math.round((s.magicDefence || 0) * 6) + ' max HP'
	].filter(Boolean);
	return '<div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.6">' + lines.join('<br>') + '</div>';
}
function renderStats(){
	const s = computeStats();
	const defs = [
		{ key:'magicPower',    label:'Power',    icon:'⚔️',  color:'#e74c3c' },
		{ key:'magicControl',  label:'Control',  icon:'🎯',  color:'#9b59b6' },
		{ key:'manaRegen',     label:'Mana Regen', icon:'💧',  color:'#3498db' },
		{ key:'magicDefence',  label:'Defence',  icon:'🛡️',  color:'#2ecc71' },
	];
	document.getElementById('statsBar').innerHTML = defs.map(d =>
		`<div class="stat-chip"><span class="stat-icon">${d.icon}</span>${d.label}: <span class="stat-val" style="color:${d.color}">${s[d.key]}</span></div>`
	).join('') + `<div class="stat-chip"><span class="stat-icon">🪙</span>Gold: <span class="stat-val" style="color:var(--gold)">${STATE.gold||0}</span></div>`;

	// base stats panel (left col)
	const base = STATE.baseStats;
	document.getElementById('baseStatsPanel').innerHTML = defs.map(d => {
		const bonus = s[d.key] - base[d.key];
		return `${d.icon} ${d.label}: <b style="color:#fff">${base[d.key]}</b>` +
			(bonus > 0 ? ` <span style="color:var(--green)">+${bonus}</span>` : '') +
			` = <b style="color:${d.color}">${s[d.key]}</b>`;
	}).join('<br>') + runeStatSummary(s);

	// Rank display
	const rank = getPlayerRank();
	const info = MAGE_RANKS[rank];
	const xp = STATE.xp || 0;
	const nextRank = rank < MAGE_RANKS.length - 1 ? MAGE_RANKS[rank + 1] : null;
	let rankHtml = `<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">`;
	rankHtml += `<span style="font-size:14px;font-weight:bold;color:${info.color}">${info.icon} ${info.name}</span>`;
	if(nextRank){
		const pct = Math.max(0, Math.min(100, ((xp - info.xpReq) / (nextRank.xpReq - info.xpReq)) * 100));
		rankHtml += `<div style="margin-top:4px;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden">
			<div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#6c5ce7,#a29bfe);border-radius:4px"></div>
		</div>`;
		rankHtml += `<div style="font-size:10px;color:var(--muted);margin-top:2px">${xp} / ${nextRank.xpReq} XP — Next: ${nextRank.icon} ${nextRank.name} (max power ${nextRank.maxPower})</div>`;
	} else {
		rankHtml += `<div style="font-size:10px;color:var(--muted);margin-top:2px">${xp} XP — MAX RANK (power cap ${info.maxPower})</div>`;
	}
	rankHtml += `</div>`;
	document.getElementById('baseStatsPanel').innerHTML += rankHtml;

	// Mage class display
	const cls = MAGE_CLASSES.find(c => c.id === (STATE.mageClass || 'none')) || MAGE_CLASSES[0];
	let classHtml = `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">`;
	classHtml += `<div style="display:flex;align-items:center;justify-content:space-between">`;
	classHtml += `<span style="font-size:14px;font-weight:bold;color:${cls.color}">${cls.icon} ${cls.name}</span>`;
	classHtml += `<button onclick="openClassSelect()" style="font-size:10px;padding:2px 8px;background:rgba(255,255,255,.1);border:1px solid var(--border);border-radius:4px;color:var(--muted);cursor:pointer">Change</button>`;
	classHtml += `</div>`;
	classHtml += `<div style="font-size:10px;color:var(--muted);margin-top:2px">${cls.desc}</div>`;
	classHtml += `</div>`;
	document.getElementById('baseStatsPanel').innerHTML += classHtml;
}

/* =============================================================
   MAGE CLASS SELECTION
   ============================================================= */
function openClassSelect(){
	// remove existing modal if any
	let old = document.getElementById('classSelectModal');
	if(old) old.remove();

	const overlay = document.createElement('div');
	overlay.id = 'classSelectModal';
	overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9999';
	overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });

	let html = `<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;max-width:360px;width:90%">`;
	html += `<div style="font-size:16px;font-weight:bold;color:#fff;margin-bottom:12px;text-align:center">Choose Mage Class</div>`;
	for(const cls of MAGE_CLASSES){
		if(cls.id === 'none') continue; // skip unspecialized from list
		const isActive = STATE.mageClass === cls.id;
		const border = isActive ? `2px solid ${cls.color}` : '1px solid var(--border)';
		const bg = isActive ? 'rgba(255,255,255,.08)' : 'rgba(255,255,255,.03)';
		html += `<div onclick="selectMageClass('${cls.id}')" style="cursor:pointer;padding:10px;margin-bottom:6px;border-radius:6px;border:${border};background:${bg}">`;
		html += `<span style="font-size:14px;font-weight:bold;color:${cls.color}">${cls.icon} ${cls.name}</span>`;
		html += `<div style="font-size:11px;color:var(--muted);margin-top:2px">${cls.desc}</div>`;
		html += `</div>`;
	}
	html += `<div onclick="selectMageClass('none')" style="cursor:pointer;padding:8px;text-align:center;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.03);font-size:11px;color:var(--muted)">⚪ Remove Specialization</div>`;
	html += `</div>`;

	overlay.innerHTML = html;
	document.body.appendChild(overlay);
}

function selectMageClass(id){
	STATE.mageClass = id;
	writeExtrasToActiveLoadout();
	saveState();
	notifyGameSpellsChanged();
	const modal = document.getElementById('classSelectModal');
	if(modal) modal.remove();
	renderStats();
}

/* =============================================================
   RENDER: EQUIPMENT SLOTS (left col)
   ============================================================= */
const EQUIP_LABELS = {
	staff: { label:'Staff', icon:'🪄' },
	robe:  { label:'Robe',  icon:'👘' },
	relic1:{ label:'Relic 1',icon:'💎' },
	relic2:{ label:'Relic 2',icon:'💎' },
};

function renderEquipment(){
	const wrap = document.getElementById('equipSlots');
	wrap.innerHTML = '';
	for(const slotKey of ['staff','robe','relic1','relic2']){
		const raw = STATE.equipment[slotKey];
		const inst = raw && typeof GearSystem !== 'undefined' ? GearSystem.resolveEquip(raw) : (raw ? { itemId: typeof raw === 'string' ? raw : raw.itemId } : null);
		const id = inst && inst.itemId;
		const item = id ? ITEM_DB[id] : null;
		const el = document.createElement('div');
		el.className = 'equip-slot' + (item ? ' filled' : '');
		if(inst && inst.nightmare) el.setAttribute('data-nightmare', '1');
		else if(inst && inst.corruptionId && item && item.rarity !== 'cursed') el.setAttribute('data-corrupt', '1');
		if(item){
			const stats = (typeof GearSystem !== 'undefined' && inst.uid) ? GearSystem.getInstanceStats(inst) : (item.stats || {});
			const statStr = Object.entries(stats).map(([k,v])=>{
				const nice = k.replace('magic','').replace(/([A-Z])/,' $1');
				return `+${v} ${nice}`;
			}).join(', ');
			const shown = (typeof GearSystem !== 'undefined' && inst.uid) ? GearSystem.displayName(inst) : item.name;
			const rarity = (typeof GearSystem !== 'undefined' && inst.uid) ? GearSystem.displayRarity(inst) : item.rarity;
			const boost = ITEM_BOOSTS[id];
			const boostStr = boost ? `<div class="eq-sub" style="color:#f0c060;font-size:10px">⚡ ${boost.desc}</div>` : '';
			const fx = item.effectText && item.effectText !== 'None.' ? `<div class="eq-sub" style="color:#f0c060;font-size:10px">⚡ ${item.effectText}</div>` : '';
			el.innerHTML = `
				<div class="eq-icon">${item.icon}</div>
				<div class="eq-info">
					<div class="eq-name" style="color:var(--rarity-${rarity})">${shown}</div>
					<div class="eq-sub">${statStr}</div>
					${fx}${boostStr}
				</div>
				<button class="unequip-btn" data-slot="${slotKey}" title="Unequip">✕</button>
			`;
			el.querySelector('.unequip-btn').addEventListener('click', e => {
				e.stopPropagation();
				unequipItem(slotKey);
			});
			el.addEventListener('click', () => { if(inst && inst.itemId) openInspect(inst, slotKey); });
		} else {
			el.innerHTML = `
				<div class="eq-icon" style="opacity:.3">${EQUIP_LABELS[slotKey].icon}</div>
				<div class="eq-label">${EQUIP_LABELS[slotKey].label} — empty</div>
			`;
		}
		wrap.appendChild(el);
	}
}

function unequipItem(slotKey){
	const prev = STATE.equipment[slotKey];
	if(!prev) return;
	STATE.equipment[slotKey] = null;
	if(typeof prev === 'object' && prev.uid) STATE.inventory.push(prev);
	else addToInventory(typeof prev === 'string' ? prev : prev.itemId, 1);
	saveState(); renderAll();
}

/* =============================================================
   RENDER: INVENTORY GRID (center)
   ============================================================= */
function getFilteredInventory(){
	if(!searchTerm) return STATE.inventory;
	const q = searchTerm.toLowerCase();
	return STATE.inventory.filter(entry => {
		const item = ITEM_DB[entry.itemId];
		const shown = (typeof GearSystem !== 'undefined' && entry.uid) ? GearSystem.displayName(entry) : ((typeof scrollDisplayName === 'function' ? scrollDisplayName(entry, ITEM_DB) : (item && item.name)) || '');
		const name = shown || (item && item.name) || '';
		return item && (name.toLowerCase().includes(q) || item.name.toLowerCase().includes(q) || item.type.toLowerCase().includes(q));
	});
}

function renderInventory(){
	const filtered = getFilteredInventory();
	const totalPages = Math.max(1, Math.ceil(filtered.length / INV_PAGE_SIZE));
	if(invPage >= totalPages) invPage = totalPages - 1;
	if(invPage < 0) invPage = 0;

	document.getElementById('pageInfo').textContent = `${invPage+1} / ${totalPages}`;
	document.getElementById('prevPage').disabled = invPage === 0;
	document.getElementById('nextPage').disabled = invPage >= totalPages - 1;

	const start = invPage * INV_PAGE_SIZE;
	const pageItems = filtered.slice(start, start + INV_PAGE_SIZE);

	const grid = document.getElementById('invGrid');
	grid.innerHTML = '';
	for(let i = 0; i < INV_PAGE_SIZE; i++){
		const cell = document.createElement('div');
		cell.className = 'inv-cell';
		if(pageItems[i]){
			const entry = pageItems[i];
			const item = ITEM_DB[entry.itemId];
			if(item){
				let shown = (typeof GearSystem !== 'undefined' && entry.uid) ? GearSystem.displayName(entry) : (typeof scrollDisplayName === 'function' ? scrollDisplayName(entry, ITEM_DB) : item.name);
				if(item.type === 'gem' && typeof GearSystem !== 'undefined'){
					const q = entry.quality || 'normal';
					const qn = GearSystem.GEM_QUALITIES[q];
					shown = (qn ? qn.name + ' ' : '') + item.name;
					if(q === 'perfect') cell.setAttribute('data-gem-perfect', '1');
				}
				let rarity = (entry.itemId === 'player_scroll' || entry.spell) ? 'pink' : item.rarity;
				if(typeof GearSystem !== 'undefined' && entry.uid) rarity = GearSystem.displayRarity(entry);
				cell.setAttribute('data-rarity', rarity);
				cell.setAttribute('data-item-id', entry.itemId);
				if(entry.variantId) cell.setAttribute('data-variant', '1');
				if(entry.nightmare) cell.setAttribute('data-nightmare', '1');
				else if(entry.corruptionId && item.rarity !== 'cursed') cell.setAttribute('data-corrupt', '1');
				let badge = '';
				if(entry.nightmare) badge = '<span class="cell-badge">☠</span>';
				else if(entry.corruptionId && item.rarity !== 'cursed') badge = '<span class="cell-badge">⛓</span>';
				else if(entry.variantId) badge = '<span class="cell-badge">◆</span>';
				cell.innerHTML = `
					${badge}
					<span class="cell-icon">${item.icon}</span>
					<span class="cell-name">${shown}</span>
					${entry.qty > 1 ? `<span class="cell-qty">x${entry.qty}</span>` : ''}
				`;
				cell.addEventListener('mouseenter', e => showTooltip(e, item, entry.qty, entry));
				cell.addEventListener('mousemove', e => moveTooltip(e));
				cell.addEventListener('mouseleave', hideTooltip);
				cell.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); openCtxMenu(e, entry); });
				cell.addEventListener('click', e => { e.stopPropagation(); openCtxMenu(e, entry); });
			}
		}
		grid.appendChild(cell);
	}
}

/* =============================================================
   TOOLTIP
   ============================================================= */
const tooltipEl = document.getElementById('tooltip');
function showTooltip(e, item, qty, entry){
	const shown = (entry && typeof GearSystem !== 'undefined' && entry.uid) ? GearSystem.displayName(entry) : ((entry && typeof scrollDisplayName === 'function') ? scrollDisplayName(entry, ITEM_DB) : item.name);
	let rarity = (entry && (entry.itemId === 'player_scroll' || entry.spell)) ? 'pink' : item.rarity;
	if(entry && typeof GearSystem !== 'undefined' && entry.uid) rarity = GearSystem.displayRarity(entry);
	const rarityLabel = rarity === 'pink' ? 'pink · player-made' : rarity;
	const stats = (entry && typeof GearSystem !== 'undefined' && entry.uid) ? GearSystem.getInstanceStats(entry) : (item.stats || {});
	const statLines = Object.entries(stats).map(([k,v])=>{
		const nice = k.replace('magic','Magic ');
		return `<div class="tt-stat">+${v} ${nice}</div>`;
	}).join('');
	const boostData = ITEM_BOOSTS[entry && entry.itemId];
	const boostLine = boostData ? `<div class="tt-stat" style="color:#f0c060;font-size:10px">⚡ ${boostData.desc}</div>` : '';
	const gearExtra = (entry && typeof GearSystem !== 'undefined' && entry.uid) ? GearSystem.tooltipExtra(entry) : (item.effectText && item.effectText !== 'None.' ? `<div class="tt-stat" style="color:#f0c060">⚡ ${item.effectText}</div>` : '');
	let extra = '';
	if(item.type === 'scroll'){
		const stored = typeof resolveScrollSpell === 'function' ? resolveScrollSpell(entry, ITEM_DB) : (entry && entry.spell) || item.spell;
		if(stored){
			extra = `<div class="tt-stat" style="color:#ffb6e0">Stored: ${escHtml(stored.name||'Spell')}</div>`;
			if(typeof generateSpellDescription === 'function'){
				extra += `<div class="tt-desc">${escHtml(generateSpellDescription(stored))}</div>`;
			}
			extra += `<div class="tt-desc">Reusable — does not disappear when used.</div>`;
		} else if(item.blank){
			extra = `<div class="tt-desc">Engrave one of your spells to create a pink player-made scroll.</div>`;
		}
	}
	tooltipEl.innerHTML = `
		<div class="tt-name" style="color:var(--rarity-${rarity})">${escHtml(shown)}${qty>1?' x'+qty:''}</div>
		<div class="tt-type">${item.type} · ${rarityLabel}</div>
		${statLines}
		${boostLine}
		${gearExtra}
		<div class="tt-desc">${item.desc||''}</div>
		${extra}
	`;
	tooltipEl.style.display = 'block';
	moveTooltip(e);
}
function moveTooltip(e){
	let x = e.clientX + 14, y = e.clientY + 14;
	const r = tooltipEl.getBoundingClientRect();
	if(x + r.width > window.innerWidth) x = e.clientX - r.width - 8;
	if(y + r.height > window.innerHeight) y = e.clientY - r.height - 8;
	tooltipEl.style.left = x+'px'; tooltipEl.style.top = y+'px';
}
function hideTooltip(){ tooltipEl.style.display = 'none'; }

/* =============================================================
   CONTEXT MENU (right-click or click on item)
   ============================================================= */
const ctxMenu = document.getElementById('ctxMenu');
let ctxEntry = null;

function openCtxMenu(e, entry){
	ctxEntry = entry;
	const item = ITEM_DB[entry.itemId];
	if(!item) return;
	ctxMenu.innerHTML = '';
	const slots = (typeof GearSystem !== 'undefined') ? GearSystem.equipSlotsFor(entry) : ({ staff:['staff'], robe:['robe'], relic:['relic1','relic2'] }[item.type] || []);
	if(slots.length){
		const opt = document.createElement('div');
		opt.className = 'ctx-item';
		opt.textContent = 'Equip';
		opt.addEventListener('click', () => { smartEquip(entry); closeCtxMenu(); });
		ctxMenu.appendChild(opt);
	}
	{
		const insp = document.createElement('div');
		insp.className = 'ctx-item';
		insp.textContent = 'Inspect';
		insp.addEventListener('click', () => { closeCtxMenu(); openInspect(entry); });
		ctxMenu.appendChild(insp);
	}
	if(item.type === 'scroll'){
		const stored = typeof resolveScrollSpell === 'function' ? resolveScrollSpell(entry, ITEM_DB) : null;
		const blank = typeof isBlankScroll === 'function' ? isBlankScroll(item, entry) : !!item.blank && !stored;
		if(blank){
			const opt = document.createElement('div');
			opt.className = 'ctx-item';
			opt.textContent = 'Engrave Spell…';
			opt.addEventListener('click', () => { closeCtxMenu(); openScrollPicker(entry, 'engrave'); });
			ctxMenu.appendChild(opt);
		} else if(stored){
			const opt = document.createElement('div');
			opt.className = 'ctx-item';
			opt.textContent = 'Copy Spell to Slot…';
			opt.addEventListener('click', () => { closeCtxMenu(); openScrollPicker(entry, 'apply'); });
			ctxMenu.appendChild(opt);
		}
	}
	// always show cancel
	const cancel = document.createElement('div');
	cancel.className = 'ctx-item';
	cancel.textContent = 'Cancel';
	cancel.addEventListener('click', closeCtxMenu);
	ctxMenu.appendChild(cancel);

	ctxMenu.classList.add('open');
	let x = e.clientX, y = e.clientY;
	ctxMenu.style.left = x+'px'; ctxMenu.style.top = y+'px';
	setTimeout(()=>{
		const r = ctxMenu.getBoundingClientRect();
		if(r.right > window.innerWidth) ctxMenu.style.left = (x - r.width)+'px';
		if(r.bottom > window.innerHeight) ctxMenu.style.top = (y - r.height)+'px';
	},0);
}
function closeCtxMenu(){ ctxMenu.classList.remove('open'); ctxEntry = null; }
document.addEventListener('click', e => { if(!ctxMenu.contains(e.target)) closeCtxMenu(); });

/* =============================================================
   EQUIP / INVENTORY HELPERS
   ============================================================= */
function smartEquip(entry){
	const slots = (typeof GearSystem !== 'undefined') ? GearSystem.equipSlotsFor(entry) : [];
	if(!slots.length) return;
	let slot = slots.find(sl => !STATE.equipment[sl]) || slots[0];
	equipItem(entry, slot);
}

function equipItem(entry, slotKey){
	const prev = STATE.equipment[slotKey];
	if(prev){
		if(typeof prev === 'object' && prev.uid) STATE.inventory.push(prev);
		else addToInventory(typeof prev === 'string' ? prev : prev.itemId, 1);
	}
	if(entry.uid){
		STATE.equipment[slotKey] = entry;
		removeFromInventory(entry.itemId, 1, entry.uid);
	} else if(typeof GearSystem !== 'undefined' && GearSystem.isGear(entry.itemId)){
		const inst = GearSystem.createInstance(entry.itemId, entry);
		STATE.equipment[slotKey] = inst;
		removeFromInventory(entry.itemId, 1, entry.uid);
	} else {
		STATE.equipment[slotKey] = entry.itemId;
		removeFromInventory(entry.itemId, 1);
	}
	if(typeof GearSystem !== 'undefined') GearSystem.discover(STATE, STATE.equipment[slotKey]);
	saveState(); renderAll();
}

function addToInventory(itemId, qty, extra){
	if(itemId && typeof itemId === 'object'){
		STATE.inventory.push(itemId);
		if(typeof GearSystem !== 'undefined') GearSystem.discover(STATE, itemId);
		return;
	}
	if(itemId === 'player_scroll' || (extra && extra.uid)){
		STATE.inventory.push(Object.assign({ itemId, qty: qty || 1 }, extra || {}));
		return;
	}
	if(typeof GearSystem !== 'undefined' && GearSystem.isGear(itemId)){
		const inst = GearSystem.createInstance(itemId, extra || {});
		STATE.inventory.push(inst);
		GearSystem.discover(STATE, inst);
		return;
	}
	const q = extra && extra.quality;
	const existing = STATE.inventory.find(e => e.itemId === itemId && !e.uid && (e.quality || 'normal') === (q || e.quality || 'normal'));
	if(existing) existing.qty += qty;
	else STATE.inventory.push(Object.assign({ itemId, qty }, q ? { quality: q } : {}));
	if(typeof GearSystem !== 'undefined' && GearSystem.isGem(itemId)) GearSystem.discoverGem(STATE, itemId, extra && extra.quality);
}

function removeFromInventory(itemId, qty, uid, quality){
	const idx = STATE.inventory.findIndex(e => e.itemId === itemId && (uid ? e.uid === uid : !e.uid) && (quality == null || (e.quality || 'normal') === quality));
	if(idx === -1) return;
	if(STATE.inventory[idx].uid){ STATE.inventory.splice(idx, 1); return; }
	STATE.inventory[idx].qty -= qty;
	if(STATE.inventory[idx].qty <= 0) STATE.inventory.splice(idx, 1);
}

let inspectEntry = null;
let inspectSlot = null;

function openInspect(entry, fromSlot){
	inspectEntry = entry;
	inspectSlot = fromSlot || null;
	const overlay = document.getElementById('inspectOverlay');
	const card = document.getElementById('inspectCard');
	if(card) card.classList.remove('wide');
	const body = document.getElementById('inspectBody');
	const item = ITEM_DB[entry.itemId];
	if(typeof GearSystem !== 'undefined' && (entry.uid || GearSystem.isGear(entry.itemId))){
		const inst = entry.uid ? entry : GearSystem.createInstance(entry.itemId, entry);
		body.innerHTML = GearSystem.inspectHtml(inst, ITEM_DB);
		bindInspectGems(inst);
	} else if(item && item.type === 'gem' && typeof GearSystem !== 'undefined'){
		const q = entry.quality || 'normal';
		const qn = (GearSystem.GEM_QUALITIES[q] && GearSystem.GEM_QUALITIES[q].name) || 'Normal';
		const nums = GearSystem.formatGemModList((GearSystem.GEMS[entry.itemId]||{}).mods, GearSystem.gemQualityMult(q));
		body.innerHTML = `<div class="insp-name">${qn} ${item.name}</div><div class="insp-type">gem · ${q}</div><div class="insp-body">${item.desc||''}</div><div class="insp-block"><div class="insp-label">Bonuses</div><div class="insp-stat">${nums}</div></div>`;
	} else {
		body.innerHTML = `<div class="insp-name">${item ? item.name : entry.itemId}</div><div class="insp-body">${item ? (item.desc||'') : ''}</div>`;
	}
	const eqBtn = document.getElementById('inspectEquipBtn');
	const canEquip = item && (item.type === 'staff' || item.type === 'robe' || item.type === 'relic');
	eqBtn.style.display = (canEquip && !fromSlot && !entry._collection) ? '' : 'none';
	overlay.classList.add('open');
}
function openCollectionInspect(itemId, view){
	if(typeof GearSystem === 'undefined') return;
	const col = GearSystem.ensureCollection(STATE);
	if(!col.items[itemId]) return;
	inspectEntry = { itemId: itemId, _collection: true, _colView: view || { itemId: itemId, variantId: '', mode: 'normal', corrId: '' } };
	if(view) inspectEntry._colView = view;
	inspectSlot = null;
	const overlay = document.getElementById('inspectOverlay');
	const card = document.getElementById('inspectCard');
	const body = document.getElementById('inspectBody');
	body.innerHTML = GearSystem.collectionInspectHtml(itemId, col, inspectEntry._colView);
	if(card) card.classList.add('wide');
	const eqBtn = document.getElementById('inspectEquipBtn');
	if(eqBtn) eqBtn.style.display = 'none';
	overlay.classList.add('open');
	bindCollectionInspect(itemId);
}
function bindCollectionInspect(itemId){
	const root = document.querySelector('.col-insp');
	if(!root) return;
	const cur = inspectEntry && inspectEntry._colView ? inspectEntry._colView : { variantId:'', mode:'normal', corrId:'' };
	root.querySelectorAll('[data-col-var]').forEach(el => {
		el.addEventListener('click', () => {
			if(el.disabled) return;
			openCollectionInspect(itemId, { variantId: el.getAttribute('data-col-var') || '', mode: cur.mode, corrId: cur.corrId });
		});
	});
	root.querySelectorAll('[data-col-mode]').forEach(el => {
		el.addEventListener('click', () => {
			if(el.disabled) return;
			openCollectionInspect(itemId, { variantId: cur.variantId || '', mode: el.getAttribute('data-col-mode') || 'normal', corrId: cur.corrId });
		});
	});
	root.querySelectorAll('[data-col-corr]').forEach(el => {
		el.addEventListener('click', () => {
			openCollectionInspect(itemId, { variantId: cur.variantId || '', mode: cur.mode, corrId: el.getAttribute('data-col-corr') || '' });
		});
	});
}

function bindInspectGems(inst){
	const body = document.getElementById('inspectBody');
	body.querySelectorAll('.insp-gem').forEach((el, idx) => {
		el.addEventListener('click', () => {
			if(inst.gems[idx]){
				const ref = GearSystem.parseGemRef(inst.gems[idx]);
				addToInventory(ref.id, 1, { quality: ref.quality });
				inst.gems[idx] = null;
			} else {
				const gems = STATE.inventory.filter(e => ITEM_DB[e.itemId] && ITEM_DB[e.itemId].type === 'gem');
				if(!gems.length){ alert('No gems in your inventory.'); return; }
				const names = gems.map((g,i) => {
					const qn = (g.quality && GearSystem.GEM_QUALITIES[g.quality]) ? GearSystem.GEM_QUALITIES[g.quality].name : 'Normal';
					const nums = GearSystem.formatGemModList((GearSystem.GEMS[g.itemId]||{}).mods, GearSystem.gemQualityMult(g.quality || 'normal'));
					return (i+1)+'. '+(ITEM_DB[g.itemId].icon||'')+' '+qn+' '+ITEM_DB[g.itemId].name+' ('+nums+')';
				});
				const choice = prompt('Socket which gem?\n'+names.join('\n'), '1');
				const n = parseInt(choice, 10) - 1;
				if(!(n >= 0 && n < gems.length)) return;
				const pick = gems[n];
				inst.gems[idx] = { itemId: pick.itemId, quality: pick.quality || 'normal' };
				removeFromInventory(pick.itemId, 1, pick.uid, pick.quality || 'normal');
			}
			if(typeof GearSystem !== 'undefined') GearSystem.discover(STATE, inst);
			saveState();
			openInspect(inst, inspectSlot);
			renderAll();
		});
	});
}

function closeInspect(){
	document.getElementById('inspectOverlay').classList.remove('open');
	const card = document.getElementById('inspectCard');
	if(card) card.classList.remove('wide');
	inspectEntry = null;
	inspectSlot = null;
}
document.getElementById('inspectCloseBtn')?.addEventListener('click', closeInspect);
document.getElementById('inspectEquipBtn')?.addEventListener('click', () => {
	if(inspectEntry) smartEquip(inspectEntry);
	closeInspect();
});

function writeSpellToSlot(slotIdx, spell){
	if(!MagicEngine.isMagicSpell(spell)){
		alert('This scroll holds an old-style spell. The new rune magic cannot use it — build the spell in the Rune Forge instead.');
		return;
	}
	const copy = typeof cloneSpellData === 'function' ? cloneSpellData(spell) : JSON.parse(JSON.stringify(spell));
	if(slotIdx === 9) copy.isUltimate = true;
	else delete copy.isUltimate;
	STATE.spells[slotIdx] = copy;
	if(STATE.activeLoadoutIdx >= 0 && STATE.activeLoadoutIdx < STATE.loadouts.length){
		STATE.loadouts[STATE.activeLoadoutIdx].spells[slotIdx] = JSON.parse(JSON.stringify(copy));
		if(STATE.loadouts[STATE.activeLoadoutIdx].type === 'transformation')
			STATE.transformSpells[slotIdx] = JSON.parse(JSON.stringify(copy));
	}
	saveState();
	renderSpellSlots();
	renderInventory();
	notifyGameSpellsChanged();
}

function closeScrollPicker(){
	document.getElementById('scrollModal').classList.remove('open');
}

function openScrollPicker(entry, mode){
	const title = document.getElementById('scrollModalTitle');
	const body = document.getElementById('scrollModalBody');
	title.textContent = mode === 'engrave' ? 'Engrave a Spell' : 'Copy Spell to Slot';
	body.innerHTML = '';
	if(mode === 'engrave'){
		const note = document.createElement('div');
		note.style.cssText = 'font-size:12px;color:var(--muted)';
		note.textContent = 'Pick a spell slot to engrave onto this blank scroll. The scroll becomes pink (player-made) and the original spell stays in its slot.';
		body.appendChild(note);
	} else {
		const stored = resolveScrollSpell(entry, ITEM_DB);
		const note = document.createElement('div');
		note.style.cssText = 'font-size:12px;color:var(--muted)';
		note.textContent = 'Copy "' + (stored && stored.name ? stored.name : 'this spell') + '" into a slot. The scroll stays in your inventory.';
		body.appendChild(note);
	}
	for(let i = 0; i < 10; i++){
		const sp = STATE.spells[i];
		const btn = document.createElement('button');
		btn.className = 'btn btn-ghost';
		btn.style.cssText = 'text-align:left;width:100%';
		const label = i === 9 ? '⚡ Ultimate' : ('Slot ' + (i + 1));
		if(mode === 'engrave'){
			if(!sp){
				btn.disabled = true;
				btn.textContent = label + ' — empty';
			} else {
				btn.textContent = label + ' — ' + sp.name;
				btn.addEventListener('click', () => {
					const made = makePlayerScrollEntry(sp);
					removeFromInventory('blank_scroll', 1);
					STATE.inventory.push(made);
					saveState();
					closeScrollPicker();
					renderAll();
				});
			}
		} else {
			btn.textContent = label + (sp ? ' — replace ' + sp.name : ' — empty');
			btn.addEventListener('click', () => {
				const stored = resolveScrollSpell(entry, ITEM_DB);
				if(!stored) return;
				writeSpellToSlot(i, stored);
				closeScrollPicker();
			});
		}
		body.appendChild(btn);
	}
	document.getElementById('scrollModal').classList.add('open');
}
document.getElementById('scrollModalClose').addEventListener('click', closeScrollPicker);
document.getElementById('scrollModalCancel').addEventListener('click', closeScrollPicker);

function rankName(idx){
	return MAGE_RANKS[idx] ? (MAGE_RANKS[idx].icon + ' ' + MAGE_RANKS[idx].name) : 'Rank '+idx;
}

function dictTag(cls, text){
	return '<span class="dict-tag '+cls+'">'+text+'</span>';
}

function dictEntryHtml(kind, key){
	if(kind==='shape'){
		const s = SHAPES[key];
		if(!s) return '';
		const rank = SHAPE_RANK_REQ[key] ?? '?';
		const det = DICT_SHAPE_DETAILS[key] || {};
		let html = '<div class="dict-card">';
		html += '<h4>'+s.icon+' '+s.label+' <span style="font-size:11px;color:var(--muted);font-weight:normal">('+key+')</span></h4>';
		html += '<div class="dict-tags">';
		html += dictTag('mana', '💧 Mana: '+s.manaCost);
		html += dictTag('ctrl', '🎮 Control: '+s.controlReq);
		html += dictTag('rank', '🏅 '+rankName(rank));

		return html;
	}
	if(kind==='behavior'){

		const rank = BEHAVIOR_RANK_REQ[key] ?? '?';
		const det = DICT_BEHAVIOR_DETAILS[key] || {};

		html += '<h4>'+b.label+' <span style="font-size:11px;color:var(--muted);font-weight:normal">('+key+')</span>';

		html += dictTag('ctrl', '🎮 Control: '+b.controlReq);
		html += dictTag('rank', '🏅 '+rankName(rank));
		if(b.dmgNote) html += dictTag(b.dmgNote.includes('-')?'dmg-down':'dmg-up', b.dmgNote);
		html += '</div>';
		html += '<p class="dict-detail"><b>Description:</b> '+b.desc+'</p>';
		if(det.dmgMod) html += '<p class="dict-detail"><b>Damage Modifier:</b> '+det.dmgMod+'</p>';
		if(det.phaseNote) html += '<p class="dict-detail"><b>Mechanics:</b> '+det.phaseNote+'</p>';
		if(det.extraNote) html += '<p class="dict-detail"><b>Note:</b> '+det.extraNote+'</p>';
		html += '</div>';
		return html;
	}
	if(kind==='effect'){
		const e = EFFECTS[key];
		if(!e) return '';
		const rank = EFFECT_RANK_REQ[key] ?? '?';
		const det = DICT_EFFECT_DETAILS[key] || {};
		let html = '<div class="dict-card">';
		html += '<h4>'+e.icon+' '+e.label+' <span style="font-size:11px;color:var(--muted);font-weight:normal">('+key+')</span></h4>';

		html += dictTag('mana', '💧 Mana: +'+e.manaCost);
		html += dictTag('ctrl', '🎮 Control: '+e.controlReq);
		html += dictTag('rank', '🏅 '+rankName(rank));
		if(e.dmgNote) html += dictTag(e.dmgNote.includes('-')||e.dmgNote.includes('no')?'dmg-down':'dmg-up', e.dmgNote);
		html += '</div>';
		html += '<p class="dict-detail"><b>Description:</b> '+e.desc+'</p>';
		if(det.phaseNote) html += '<p class="dict-detail"><b>Mechanics:</b> '+det.phaseNote+'</p>';
		if(det.extraNote) html += '<p class="dict-detail"><b>Note:</b> '+det.extraNote+'</p>';

		return html;
	}
	return '';
