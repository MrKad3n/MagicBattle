function renderDictSection(cat){
	// Update active category button
	document.querySelectorAll('.dict-cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
	const el = document.getElementById('dictContent');
	if(!el) return;

	if(cat === 'shapes')    el.innerHTML = renderDictShapes();
	else if(cat === 'behaviors') el.innerHTML = renderDictBehaviors();
	else if(cat === 'effects')   el.innerHTML = renderDictEffects();
	else if(cat === 'domains')   el.innerHTML = renderDictDomains();
	else if(cat === 'ultimates') el.innerHTML = renderDictUltimates();
	else if(cat === 'phases')    el.innerHTML = renderDictPhases();
	else if(cat === 'classes')   el.innerHTML = renderDictClasses();
}

let craftSearch = '';

function switchTab(tab){
	document.getElementById('inventoryTab').style.display = tab === 'inventory' ? 'flex' : 'none';
	const col = document.getElementById('collectionTab');
	if(col) col.style.display = tab === 'collection' ? 'flex' : 'none';
	document.getElementById('craftingTab').style.display  = tab === 'crafting'  ? 'flex' : 'none';
	document.getElementById('questTab').style.display     = tab === 'quests'    ? 'flex' : 'none';
	document.getElementById('bestiaryTab').style.display  = tab === 'bestiary'  ? 'flex' : 'none';
	document.getElementById('dictionaryTab').style.display= tab === 'dictionary'? 'flex' : 'none';
	document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
	if(tab === 'collection') renderCollection();
	if(tab === 'crafting') renderCraftList();
	if(tab === 'quests') renderQuestList();
	if(tab === 'bestiary') renderBestiary();
	if(tab === 'dictionary') renderDictSection('shapes');
}

function renderCollection(){
	const host = document.getElementById('collectionList');
	if(!host || typeof GearSystem === 'undefined') return;
	const col = GearSystem.ensureCollection(STATE);
	const groups = { fire:'🔥 Fire', ice:'❄️ Ice', earth:'🌿 Jungle', special:'✨ Mythic' };
	let html = '';
	for(const dungeon of Object.keys(groups)){
		html += '<div class="col-dungeon"><h4 style="margin:0 0 8px">'+groups[dungeon]+'</h4><div class="col-grid">';
		for(const id of Object.keys(GearSystem.ITEMS)){
			const it = GearSystem.ITEMS[id];
			if(it.dungeon !== dungeon) continue;
			const found = !!col.items[id];
			const tier = found ? GearSystem.collectionTier(id, col) : '';
			html += '<div class="col-item'+(found?' found':'')+(tier?' tier-'+tier:'')+'"'+(found?' data-col-item="'+id+'"':'')+'>';
			if(found) html += '<div class="col-ico">'+it.icon+'</div><div class="col-name" style="color:var(--rarity-'+it.rarity+')">'+it.name+'</div>';
			else html += '<div class="col-ico">?</div><div class="col-name undiscovered">???</div>';
			html += '</div>';
		}
		html += '</div></div>';
	}
	html += '<div class="col-dungeon"><h4 style="margin:0 0 8px">💎 Gems</h4><div class="col-grid">';
	for(const id of Object.keys(GearSystem.GEMS)){
		const g = GearSystem.GEMS[id];
		const found = !!col.gems[id];
		const perfect = !!(col.gemQualities && col.gemQualities[id] && col.gemQualities[id].perfect);
		html += '<div class="col-item'+(found?' found':'')+(perfect?' tier-gold':'')+'"'+(found?' data-col-gem="'+id+'"':'')+'>';
		if(found) html += '<div class="col-ico">'+g.icon+'</div><div class="col-name">'+g.name+'</div>';
		else html += '<div class="col-ico">?</div><div class="col-name undiscovered">???</div>';
		html += '</div>';
	}
	html += '</div></div>';
	host.innerHTML = html;
	host.querySelectorAll('[data-col-item]').forEach(el => {
		el.addEventListener('click', () => openCollectionInspect(el.getAttribute('data-col-item')));
	});
	host.querySelectorAll('[data-col-gem]').forEach(el => {
		el.addEventListener('click', () => {
			const gid = el.getAttribute('data-col-gem');
			const gem = GearSystem.GEMS[gid];
			if(!gem) return;
			inspectEntry = { itemId: gid, _collection: true };
			inspectSlot = null;
			const card = document.getElementById('inspectCard');
			if(card) card.classList.remove('wide');
			document.getElementById('inspectBody').innerHTML = GearSystem.collectionGemHtml(gid, col);
			const eqBtn = document.getElementById('inspectEquipBtn');
			if(eqBtn) eqBtn.style.display = 'none';
			document.getElementById('inspectOverlay').classList.add('open');
		});
	});
}
document.getElementById('colUnlockAll')?.addEventListener('click', () => {
	if(typeof GearSystem === 'undefined') return;
	GearSystem.unlockAllCollection(STATE);
	saveState();
	renderCollection();
});
document.getElementById('colPruneOwned')?.addEventListener('click', () => {
	if(typeof GearSystem === 'undefined') return;
	GearSystem.pruneCollectionToOwned(STATE);
	saveState();
	renderCollection();
});

function renderSpellTeacherQuests(wrap){
	let stSaved = null;
	try { stSaved = JSON.parse(localStorage.getItem('magicBattle_spellTeacherQuests')); } catch(e){}
	const currentIndex = stSaved ? (stSaved.qi || 0) : 0;

	const header = document.createElement('div');
	header.style.cssText = 'font-size:14px;font-weight:bold;color:#cc6644;padding:10px 0 6px 4px;border-bottom:1px solid rgba(204,102,68,0.25);margin-bottom:6px;';
	header.textContent = '🔮 Spell Teacher — Mira';
	wrap.appendChild(header);

	const totalDone = Math.min(currentIndex, SPELL_TEACHER_QUEST_DEFS.length);
	const totalAll = SPELL_TEACHER_QUEST_DEFS.length;
	const overallProg = document.createElement('div');
	overallProg.style.cssText = 'font-size:11px;color:var(--muted);margin-bottom:8px;padding-left:4px;';
	overallProg.textContent = totalDone + ' / ' + totalAll + ' quests completed';
	wrap.appendChild(overallProg);

	for(const ch of SPELL_TEACHER_CHAPTERS){
		const chDiv = document.createElement('div');
		chDiv.className = 'st-chapter';
		const chCount = ch.end - ch.start + 1;
		const chDone = Math.max(0, Math.min(currentIndex, ch.end + 1) - ch.start);
		const allDone = chDone >= chCount;
		const containsCurrent = currentIndex >= ch.start && currentIndex <= ch.end;
		if(allDone) chDiv.classList.add('all-done');

		// Header
		const head = document.createElement('div');
		head.className = 'st-chapter-head' + (containsCurrent ? ' open' : '');
		head.innerHTML = '<span class="st-arrow">▶</span>'
			+ '<span class="st-ch-title">' + (allDone ? '✅ ' : '') + ch.name + '</span>'
			+ '<span class="st-ch-prog">' + chDone + '/' + chCount + '</span>';
		head.onclick = function(){ this.classList.toggle('open'); };
		chDiv.appendChild(head);

		// Body
		const body = document.createElement('div');
		body.className = 'st-chapter-body';
		for(let i = ch.start; i <= ch.end; i++){
			const q = SPELL_TEACHER_QUEST_DEFS[i];
			if(!q) continue;
			const isComplete = i < currentIndex;
			const isCurrent = i === currentIndex;
			const row = document.createElement('div');
			row.style.cssText = 'padding:8px 10px;margin-bottom:4px;border-radius:6px;border:1px solid '
				+ (isCurrent ? 'rgba(108,92,231,0.6)' : isComplete ? 'rgba(40,167,69,0.25)' : 'rgba(255,255,255,0.06)')
				+ ';background:' + (isCurrent ? 'rgba(108,92,231,0.12)' : isComplete ? 'rgba(40,167,69,0.05)' : 'rgba(255,255,255,0.02)') + ';';
			const icon = isComplete ? '✅' : isCurrent ? '📜' : '🔒';
			const titleColor = isComplete ? '#28a745' : isCurrent ? '#f1c40f' : '#555';
			const descColor = isComplete ? '#5a8a5a' : isCurrent ? '#bbb' : '#444';
			row.innerHTML = '<div style="display:flex;align-items:center;gap:6px;">'
				+ '<span style="font-size:15px;">' + icon + '</span>'
				+ '<div style="flex:1;">'
				+ '<div style="font-size:12px;font-weight:bold;color:' + titleColor + ';">' + q.title + '</div>'
				+ '<div style="font-size:10px;color:' + descColor + ';margin-top:1px;">' + q.desc + '</div>'
				+ (q.npc && isCurrent ? '<div style="font-size:9px;color:#cc6644;margin-top:2px;">NPC: ' + q.npc + '</div>' : '')
				+ '</div>'
				+ (isCurrent ? '<span style="font-size:9px;color:#6c5ce7;white-space:nowrap;">IN PROGRESS</span>' : '')
				+ '</div>';
			body.appendChild(row);
		}
		chDiv.appendChild(body);
		wrap.appendChild(chDiv);
	}

	if(currentIndex >= SPELL_TEACHER_QUEST_DEFS.length){
		const complete = document.createElement('div');
		complete.style.cssText = 'text-align:center;padding:12px;color:#28a745;font-size:13px;font-weight:bold;margin-top:4px;';
		complete.textContent = '🎓 All Spell Teacher lessons completed — Spell Master!';
		wrap.appendChild(complete);
	}
}

function renderQuestSection(wrap, title, defs, storageKey, slimeQuestIndex){
	let saved = null;
	try { saved = JSON.parse(localStorage.getItem(storageKey)); } catch(e){}
	const currentIndex = saved ? (saved.questIndex || 0) : 0;
	const slimesKilled = saved ? (saved.slimesKilled || 0) : 0;

	// Section header
	const header = document.createElement('div');
	header.style.cssText = 'font-size:14px;font-weight:bold;color:#f1c40f;padding:10px 0 6px 4px;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:6px;';
	header.textContent = title;
	wrap.appendChild(header);

	for(let i = 0; i < defs.length; i++){
		const q = defs[i];
		const isComplete = i < currentIndex;
		const isCurrent = i === currentIndex;

		const row = document.createElement('div');
		row.style.cssText = 'padding:10px 12px;margin-bottom:6px;border-radius:8px;border:1px solid ' +
			(isCurrent ? 'rgba(108,92,231,0.6)' : isComplete ? 'rgba(40,167,69,0.3)' : 'rgba(255,255,255,0.08)') +
			';background:' + (isCurrent ? 'rgba(108,92,231,0.12)' : isComplete ? 'rgba(40,167,69,0.06)' : 'rgba(255,255,255,0.02)') + ';';

		const icon = isComplete ? '\u2705' : isCurrent ? '\ud83d\udcdc' : '\ud83d\udd12';
		const titleColor = isComplete ? '#28a745' : isCurrent ? '#f1c40f' : '#666';
		const descColor = isComplete ? '#5a8a5a' : isCurrent ? '#bbb' : '#555';

		let descText = q.desc;
		if(slimeQuestIndex >= 0 && i === slimeQuestIndex && isCurrent) descText = q.desc + ' (' + slimesKilled + '/5)';

		row.innerHTML = '<div style="display:flex;align-items:center;gap:8px;">' +
			'<span style="font-size:18px;">' + icon + '</span>' +
			'<div style="flex:1;">' +
			'<div style="font-size:13px;font-weight:bold;color:' + titleColor + ';">' + q.title + '</div>' +
			'<div style="font-size:11px;color:' + descColor + ';margin-top:2px;">' + descText + '</div>' +
			(q.npc && isCurrent ? '<div style="font-size:10px;color:#6c5ce7;margin-top:3px;">NPC: ' + q.npc + '</div>' : '') +
			'</div>' +
			(isCurrent ? '<span style="font-size:10px;color:#6c5ce7;white-space:nowrap;">IN PROGRESS</span>' : '') +
			'</div>';

		wrap.appendChild(row);
	}

	if(currentIndex >= defs.length){
		const complete = document.createElement('div');
		complete.style.cssText = 'text-align:center;padding:12px;color:#28a745;font-size:13px;font-weight:bold;margin-top:4px;';
		complete.textContent = '\ud83c\udf89 All ' + title.toLowerCase() + ' completed!';
		wrap.appendChild(complete);
	}
}

/* Sync graveyard quest progress based on graveyardStage localStorage value.
   Quests 2+ complete in city/dungeon modes where checkQuestCompletion doesn't run
   for graveyard quests, so questIndex can fall behind the actual stage. */
function syncGraveyardQuestProgress(){
	const gStage = parseInt(localStorage.getItem('magicBattle_graveyardStage')||'0');
	if(gStage < 1) return;
	const key = 'magicBattle_graveyardQuests';
	let saved = null;
	try { saved = JSON.parse(localStorage.getItem(key)); } catch(e){}
	if(!saved) saved = { questIndex:0, flags:{}, slimesKilled:0 };
	// graveyardStage >= N means quest N+1 is done (stage 1 → quests 0,1 done → index 2)
	const minIndex = gStage + 1;
	if(saved.questIndex < minIndex){
		saved.questIndex = minIndex;
		localStorage.setItem(key, JSON.stringify(saved));
	}
}

function syncDeepRootQuestProgress(){
	const drStage = parseInt(localStorage.getItem('magicBattle_deepRootStage')||'0');
	if(drStage < 1) return;
	const key = 'magicBattle_deepRootQuests';
	let saved = null;
	try { saved = JSON.parse(localStorage.getItem(key)); } catch(e){}
	if(!saved) saved = { questIndex:0, flags:{} };
	// Stages 1-2 map 1:1 to quest indices; stage 3+ maps to drStage-1
	// because "Find the Corrupted Tree" was merged with "Enter the Corruption".
	// Stage 9 also collapses with 8 (both map to "The Deep Root Horror" quest).
	const minIndex = drStage <= 2 ? drStage : drStage <= 8 ? drStage - 1 : drStage - 2;
	if(saved.questIndex < minIndex){
		saved.questIndex = minIndex;
		localStorage.setItem(key, JSON.stringify(saved));
	}
}

function syncStormIslandsQuestProgress(){
	const siData = JSON.parse(localStorage.getItem('magicBattle_stormIslandsQuest') || '{}');
	const stage = siData.stage || 0;
	if(stage < 1) return;
	const key = 'magicBattle_stormIslandsQuest';
	const minIndex = stage;
	if(!siData.questIndex || siData.questIndex < minIndex){
		siData.questIndex = minIndex;
		localStorage.setItem(key, JSON.stringify(siData));
	}
}

function renderQuestList(){
	const wrap = document.getElementById('questList');
	wrap.innerHTML = '';

	syncGraveyardQuestProgress();
	syncDeepRootQuestProgress();
	syncStormIslandsQuestProgress();

	function qp(key){ try { const s = JSON.parse(localStorage.getItem(key)); return s ? (s.questIndex||0) : 0; } catch(e){ return 0; } }
	const tutorialDone  = qp('magicBattle_tutorialQuests')    >= 10;
	const cityDone      = qp('magicBattle_cityQuests')        >= 10;
	const sylvarisDone  = qp('magicBattle_sylvarisQuests')    >= 19;
	const observatoryDone = qp('magicBattle_observatoryQuests') >= 3;

	// ===== MAIN STORY =====
	const mainHeader = document.createElement('div');
	mainHeader.style.cssText = 'font-size:16px;font-weight:bold;color:#e8c840;padding:12px 0 8px 4px;border-bottom:2px solid rgba(232,200,64,0.3);margin-bottom:8px;letter-spacing:1px;';
	mainHeader.textContent = '📖 Main Story';
	wrap.appendChild(mainHeader);

	renderQuestSection(wrap, 'Tutorial Quests', TUTORIAL_QUEST_DEFS, 'magicBattle_tutorialQuests', 8);

	if(tutorialDone)  renderQuestSection(wrap, 'City Quests', CITY_QUEST_DEFS, 'magicBattle_cityQuests', -1);
	else              renderLockedSection(wrap, 'City Quests', 'Complete Tutorial Quests to unlock.');

	if(cityDone)      renderQuestSection(wrap, 'Sylvaris Wildes', SYLVARIS_QUEST_DEFS, 'magicBattle_sylvarisQuests', -1);
	else              renderLockedSection(wrap, 'Sylvaris Wildes', 'Complete City Quests to unlock.');

	if(sylvarisDone)  renderQuestSection(wrap, 'Observatory', OBSERVATORY_QUEST_DEFS, 'magicBattle_observatoryQuests', -1);
	else              renderLockedSection(wrap, 'Observatory', 'Complete Sylvaris Wildes quests to unlock.');

	if(observatoryDone) renderQuestSection(wrap, 'Dragon Graveyard', GRAVEYARD_QUEST_DEFS, 'magicBattle_graveyardQuests', -1);
	else                renderLockedSection(wrap, 'Dragon Graveyard', 'Complete Observatory quests to unlock.');

	const graveyardDone = parseInt(localStorage.getItem('magicBattle_graveyardStage')||'0') >= 7;
	if(graveyardDone) renderQuestSection(wrap, 'Deep Root Prophecy', DEEP_ROOT_QUEST_DEFS, 'magicBattle_deepRootQuests', -1);
	else if(observatoryDone) renderLockedSection(wrap, 'Deep Root Prophecy', 'Complete Dragon Graveyard quests to unlock.');

	const playerData = JSON.parse(localStorage.getItem('magicBattle_playerData') || 'null');
	const deepRootDone = parseInt(localStorage.getItem('magicBattle_deepRootStage')||'0') >= 11;
	const hasArchmageRank = playerData && playerData.mageRank >= 4;
	if(deepRootDone && hasArchmageRank) renderQuestSection(wrap, 'Recovering the Old Society', OLD_SOCIETY_QUEST_DEFS, 'magicBattle_oldSocietyQuests', -1);
	else if(graveyardDone) renderLockedSection(wrap, 'Recovering the Old Society', 'Complete all main quests and reach Archmage rank to unlock.');

	// ===== SIDE QUESTS =====
	const sideHeader = document.createElement('div');
	sideHeader.style.cssText = 'font-size:16px;font-weight:bold;color:#5cb8e6;padding:16px 0 8px 4px;border-bottom:2px solid rgba(92,184,230,0.3);margin-bottom:8px;margin-top:12px;letter-spacing:1px;';
	sideHeader.textContent = '🌊 Side Quests';
	wrap.appendChild(sideHeader);

	const hasMageRank = playerData && playerData.mageRank >= 3;
	if(hasMageRank) renderQuestSection(wrap, 'Storm Islands', STORM_ISLANDS_QUEST_DEFS, 'magicBattle_stormIslandsQuest', -1);
	else            renderLockedSection(wrap, 'Storm Islands', 'Reach Mage rank to unlock.');

	// ===== SPELL TEACHER =====
	const stHeader = document.createElement('div');
	stHeader.style.cssText = 'font-size:16px;font-weight:bold;color:#cc6644;padding:16px 0 8px 4px;border-bottom:2px solid rgba(204,102,68,0.3);margin-bottom:8px;margin-top:12px;letter-spacing:1px;';
	stHeader.textContent = '📖 Spell Training';
	wrap.appendChild(stHeader);

	if(cityDone) renderSpellTeacherQuests(wrap);
	else         renderLockedSection(wrap, 'Spell Teacher — Mira', 'Complete City Quests to unlock.');
}

	}catch(e){}

/* ============================================================
   BESTIARY POPUP — open / close / canvas animation
   ============================================================ */
let _bafId = null;   // requestAnimationFrame handle
let _bafFrame = 0;   // total frame counter (used as time seed)
let _bafAnimF = 0;   // sprite animation frame index
let _bafPx    = 0;   // monster x position on canvas
let _bafDir   = 1;   // 1=walking right, -1=walking left
let _bafImg   = null;// loaded Image object for sprite sheet
let _bafEntry = null;// current bestiary entry

function openBestiaryPopup(entry){
	closeBestiaryPopup(); // cancel any previous animation
	_bafEntry = entry;
	const data  = BESTIARY_DATA[entry.id] || {};
	const info  = BESTIARY_SPRITE_INFO[entry.id] || {};

	// --- Populate header ---
	document.getElementById('bpIcon').textContent = entry.icon;
	const nameEl = document.getElementById('bpName');
	nameEl.textContent = entry.name + (entry.boss ? ' ⭐' : '');
	nameEl.style.color = entry.boss ? 'var(--rarity-legendary)' : '#fff';
	document.getElementById('bpZone').textContent = '📍 ' + entry.zone;
	document.getElementById('bpHPChip').textContent = '❤️ ' + entry.hp.toLocaleString() + ' HP';

	// --- Stats bars ---
	const atk = data.atk || 5, def = data.def || 5, spd = data.spd || 5;
	document.getElementById('bpAtkVal').textContent = atk + ' / 10';
	document.getElementById('bpDefVal').textContent = def + ' / 10';
	document.getElementById('bpSpdVal').textContent = spd + ' / 10';
	document.getElementById('bpAtk').style.width = (atk * 10) + '%';
	document.getElementById('bpDef').style.width = (def * 10) + '%';
	document.getElementById('bpSpd').style.width = (spd * 10) + '%';

	// --- Drops ---
	const dropsWrap = document.getElementById('bpDrops');
	dropsWrap.innerHTML = '';
	for(const drop of data.drops || []){
		const d = document.createElement('div');
		d.className = 'bp-drop-item';
		d.innerHTML = `<span style="font-size:14px">${drop.icon}</span>`
			+ `<span style="flex:1;color:#e8eaff">${drop.name}</span>`
			+ `<span style="color:var(--gold);font-size:11px">${drop.chance}</span>`;
		dropsWrap.appendChild(d);
	}
	if(!data.drops || !data.drops.length){
		dropsWrap.innerHTML = '<div style="font-size:12px;color:#666;font-style:italic">Nothing specific recorded.</div>';
	}

	// --- Description ---
	document.getElementById('bpDesc').textContent = data.desc || 'A mysterious creature lurking in the dungeon depths.';

	// --- Zone label ---
	document.getElementById('bpZoneLabel').textContent = entry.zone;

	// --- Show overlay ---
	document.getElementById('bestiaryPopupOverlay').style.display = 'flex';

	// --- Determine sprite sheet file ---
	const fileBase = info.file
		? info.file
		: (BESTIARY_FILE_OVERRIDE[entry.id] || entry.id.replace(/([A-Z])/g, '-$1').toLowerCase()) + '-sheet.png';

	_bafImg = new Image();
	_bafImg._failed = false;
	_bafImg.onerror = () => { _bafImg._failed = true; };
	_bafImg.src = info.src || ('images/enemies/' + fileBase);

	_bafFrame = 0; _bafAnimF = 0; _bafPx = 60; _bafDir = 1;

	// Defer canvas sizing until the overlay is rendered (need offsetWidth > 0)
	setTimeout(() => {
		const canvas = document.getElementById('bpCanvas');
		const bpRight = document.getElementById('bpRight');
		if(!canvas || !bpRight) return;
		canvas.width  = bpRight.offsetWidth  || 480;
		canvas.height = bpRight.offsetHeight || 400;
		function animLoop(){
			_bafId = requestAnimationFrame(animLoop);
			_drawBestiaryCanvas(entry, info);
		}
		animLoop();
	}, 0);
}

function closeBestiaryPopup(){
	if(_bafId){ cancelAnimationFrame(_bafId); _bafId = null; }
	document.getElementById('bestiaryPopupOverlay').style.display = 'none';
}

function _drawBestiaryCanvas(entry, info){
	const canvas = document.getElementById('bpCanvas');
	if(!canvas) return;
	const ctx = canvas.getContext('2d');
	const W = canvas.width, H = canvas.height;
	const theme = BESTIARY_ZONE_THEMES[entry.zone] || BESTIARY_ZONE_THEMES['???'];
	const FLOOR_H = 50;
	const floorY  = H - FLOOR_H;

	// === SKY BACKGROUND ===
	const grad = ctx.createLinearGradient(0, 0, 0, floorY);
	grad.addColorStop(0, theme.sky1);
	grad.addColorStop(1, theme.sky2);
	ctx.fillStyle = grad;
	ctx.fillRect(0, 0, W, floorY);

	// Zone-specific background decoration
	_drawZoneDecor(ctx, W, H, floorY, theme, _bafFrame);

	// === FLOOR ===
	ctx.fillStyle = theme.floor;
	ctx.fillRect(0, floorY, W, FLOOR_H);
	// floor edge highlight
	ctx.fillStyle = theme.edge;
	ctx.fillRect(0, floorY, W, 3);
	// subtle floor gradient overlay
	const fGrad = ctx.createLinearGradient(0, floorY, 0, H);
	fGrad.addColorStop(0, 'rgba(0,0,0,0)');
	fGrad.addColorStop(1, 'rgba(0,0,0,0.35)');
	ctx.fillStyle = fGrad;
	ctx.fillRect(0, floorY, W, FLOOR_H);

	// === SPRITE ===
	_bafFrame++;
	const SPRITE_FPS = 8;
	if(_bafFrame % SPRITE_FPS === 0) _bafAnimF++;

	const cols    = info.cols    !== undefined ? info.cols    : 6;
	const rows    = info.rows    !== undefined ? info.rows    : 4;
	const walkRow = info.walkRow !== undefined ? info.walkRow : 1;
	const scaleM  = info.scale   !== undefined ? info.scale   : 1.0;
	const startCol = info.startCol || 0;
	const walkFrames = info.walkFrames || Math.max(1, cols - startCol);

	if(_bafImg && !_bafImg._failed && _bafImg.naturalWidth > 0){
		const fW = _bafImg.naturalWidth  / cols;
		const fH = _bafImg.naturalHeight / rows;
		// Auto-size: target height = 35% of canvas for normals, 50% for bosses
		const targetH = entry.boss ? H * 0.50 : H * 0.36;
		const autoScale = targetH / fH;
		const sc = autoScale * scaleM;
		const dW = fW * sc, dH = fH * sc;
		const col = startCol + (_bafAnimF % walkFrames);
		const drawY = floorY - dH + 2;

		// Walk back and forth
		const speed = entry.boss ? 0.9 : 1.3;
		_bafPx += speed * _bafDir;
		if(_bafPx > W - dW - 20) _bafDir = -1;
		if(_bafPx < 20)           _bafDir = 1;

		ctx.save();
		if(_bafDir === -1){
			// Flip horizontally
			ctx.translate(_bafPx + dW, drawY);
			ctx.scale(-1, 1);
			ctx.drawImage(_bafImg, col * fW, walkRow * fH, fW, fH, 0, 0, dW, dH);
		} else {
			ctx.drawImage(_bafImg, col * fW, walkRow * fH, fW, fH, _bafPx, drawY, dW, dH);
		}
		ctx.restore();

		// Drop shadow under sprite
		ctx.save();
		ctx.globalAlpha = 0.25;
		ctx.fillStyle = '#000';
		ctx.beginPath();
		ctx.ellipse(_bafPx + dW * 0.5, floorY + 4, dW * 0.38, 7, 0, 0, Math.PI * 2);
		ctx.fill();
		ctx.restore();
	} else if(_bafImg && _bafImg._failed){
		// Fallback: draw emoji icon when sheet not found
		ctx.save();
		ctx.font = `${Math.min(W, H) * 0.28}px Arial`;
		ctx.textAlign = 'center';
		ctx.textBaseline = 'bottom';
		ctx.fillText(entry.icon, W * 0.5, floorY);
		ctx.restore();
	}
}

function _drawZoneDecor(ctx, W, H, floorY, theme, frame){
	// Floating ambient particles
	ctx.save();
	const t = frame * 0.018;
	for(let i = 0; i < 7; i++){
		const px = ((W * (i * 0.15 + 0.06) + Math.sin(t + i * 1.4) * 22) % W + W) % W;
		const py = floorY * 0.12 + Math.sin(t * 0.7 + i * 2.2) * (floorY * 0.15) + (i * (floorY * 0.11));
		const r  = 1.5 + Math.sin(t * 1.3 + i) * 0.8;
		ctx.globalAlpha = 0.25 + Math.sin(t * 1.1 + i * 0.7) * 0.15;
		ctx.beginPath();
		ctx.arc(px, py, Math.max(0.5, r), 0, Math.PI * 2);
		ctx.fillStyle = theme.accent;
		ctx.fill();
	}
	// Subtle vertical "wall" hints at the sides
	const wallW = 28;
	const wallGradL = ctx.createLinearGradient(0, 0, wallW, 0);
	wallGradL.addColorStop(0, theme.wallL);
	wallGradL.addColorStop(1, 'rgba(0,0,0,0)');
	ctx.globalAlpha = 0.7;
	ctx.fillStyle = wallGradL;
	ctx.fillRect(0, 0, wallW, H);
	const wallGradR = ctx.createLinearGradient(W - wallW, 0, W, 0);
	wallGradR.addColorStop(0, 'rgba(0,0,0,0)');
	wallGradR.addColorStop(1, theme.wallR);
	ctx.fillStyle = wallGradR;
	ctx.fillRect(W - wallW, 0, wallW, H);
	ctx.globalAlpha = 1;
	ctx.restore();
}

function renderBestiary(){
	const wrap = document.getElementById('bestiaryList');
	wrap.innerHTML = '';
	const discovered = loadBestiary();
	const total = BESTIARY_ENTRIES.length;
	const found = BESTIARY_ENTRIES.filter(e => discovered[e.id]).length;
	document.getElementById('bestiaryCount').textContent = `(${found} / ${total} discovered)`;

	// Group by zone
	const zones = [];
	const zoneMap = {};
	for(const entry of BESTIARY_ENTRIES){
		if(!zoneMap[entry.zone]){ zoneMap[entry.zone] = []; zones.push(entry.zone); }
		zoneMap[entry.zone].push(entry);
	}

	let num = 0;
	for(const zone of zones){
		const zoneHeader = document.createElement('div');
		zoneHeader.style.cssText = 'font-size:13px;font-weight:bold;color:var(--accent2);padding:8px 0 4px 4px;border-bottom:1px solid rgba(255,255,255,0.06);margin-top:8px;';
		zoneHeader.textContent = zone;
		wrap.appendChild(zoneHeader);

		for(const entry of zoneMap[zone]){
			num++;
			const unlocked = !!discovered[entry.id];
			const row = document.createElement('div');
			row.style.cssText = `padding:8px 12px;border-radius:8px;border:1px solid ${unlocked ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)'};background:${unlocked ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.2)'};display:flex;align-items:center;gap:10px;`;
			if(unlocked){
				row.className = 'bestiary-row-clickable';
				const kills = discovered[entry.id] || 0;
				row.innerHTML = `<span style="font-size:11px;color:var(--muted);min-width:24px">#${num}</span>`
					+ `<span style="font-size:18px">${entry.icon}</span>`
					+ `<div style="flex:1"><div style="font-size:13px;font-weight:bold;color:${entry.boss ? 'var(--rarity-legendary)' : '#fff'}">${entry.name}${entry.boss ? ' ⭐' : ''}</div>`
					+ `<div style="font-size:11px;color:var(--muted)">HP: ${entry.hp.toLocaleString()} · Defeated: ${kills}x</div></div>`
					+ `<span style="font-size:11px;color:var(--accent2);padding:3px 8px;border:1px solid rgba(108,92,231,0.3);border-radius:4px;background:rgba(108,92,231,0.08)">View ›</span>`;
				row.onclick = () => openBestiaryPopup(entry);
			} else {
				row.innerHTML = `<span style="font-size:11px;color:#444;min-width:24px">#${num}</span>`
					+ `<span style="font-size:18px;filter:brightness(0.2)">❓</span>`
					+ `<div style="flex:1"><div style="font-size:13px;font-weight:bold;color:#444">???</div>`
					+ `<div style="font-size:11px;color:#333">Not yet discovered</div></div>`;
			}
			wrap.appendChild(row);
		}
	}
}

function renderLockedSection(wrap, title, msg){
	const header = document.createElement('div');
	header.style.cssText = 'font-size:14px;font-weight:bold;color:#666;padding:10px 0 6px 4px;border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:6px;';
	header.textContent = '🔒 ' + title;
	wrap.appendChild(header);
	const row = document.createElement('div');
	row.style.cssText = 'padding:10px 12px;margin-bottom:6px;border-radius:8px;border:1px solid rgba(255,255,255,0.05);background:rgba(255,255,255,0.02);color:#555;font-size:12px;font-style:italic;';
	row.textContent = msg;
	wrap.appendChild(row);
}

function getIngredientCount(itemId){
	const e = STATE.inventory.find(e => e.itemId === itemId);
	return e ? e.qty : 0;
}

function canCraft(recipe){
	return recipe.ingredients.every(ing => getIngredientCount(ing.itemId) >= ing.qty);
}

function renderCraftList(){
	const wrap = document.getElementById('craftList');
	wrap.innerHTML = '';
	const RARITY_ORDER = { common:0, uncommon:1, rare:2, epic:3, legendary:4, cursed:5, mythical:6, mythic:7, nightmare:8 };
	let recipes = CRAFTING_RECIPES.slice();

	// Filter by type
	if(craftTypeFilter !== 'all'){
		recipes = recipes.filter(r => ITEM_DB[r.result]?.type === craftTypeFilter);
	}
	// Filter by search
	if(craftSearch){
		const q = craftSearch.toLowerCase();
		recipes = recipes.filter(r => {
			const item = ITEM_DB[r.result];
			if(!item) return false;
			if(item.name.toLowerCase().includes(q)) return true;
			return r.ingredients.some(ing => (ITEM_DB[ing.itemId]?.name||'').toLowerCase().includes(q));
		});
	}
	// Sort: craftable first, then by rarity
	recipes.sort((a,b) => {
		const ca = canCraft(a) ? 0 : 1;
		const cb = canCraft(b) ? 0 : 1;
		if(ca !== cb) return ca - cb;
		return (RARITY_ORDER[ITEM_DB[a.result]?.rarity]||0) - (RARITY_ORDER[ITEM_DB[b.result]?.rarity]||0);
	});

	if(!recipes.length){
		wrap.innerHTML = '<div style="text-align:center;color:#666;padding:20px">No recipes found.</div>';
		return;
	}

	for(const recipe of recipes){
		const item = ITEM_DB[recipe.result];
		if(!item) continue;
		const craftable = canCraft(recipe);
		const card = document.createElement('div');
		card.className = 'craft-card';
		if(!craftable) card.style.opacity = '0.55';

		// Icon
		const iconDiv = document.createElement('div');
		iconDiv.className = 'craft-icon';
		iconDiv.textContent = item.icon;
		card.appendChild(iconDiv);

		// Info
		const info = document.createElement('div');
		info.className = 'craft-info';

		const nameEl = document.createElement('div');
		nameEl.className = 'craft-name';
		nameEl.style.color = `var(--rarity-${item.rarity})`;
		nameEl.textContent = item.name;
		info.appendChild(nameEl);

		// Stats summary
		const statsLine = document.createElement('div');
		statsLine.style.cssText = 'font-size:10px;color:#999;margin-bottom:4px';
		const statKeys = Object.entries(item.stats||{}).filter(([,v])=>v!==0);
		statsLine.textContent = statKeys.map(([k,v])=>`${k.replace(/([A-Z])/g,' $1').trim()}: ${v>0?'+':''}${v}`).join(', ') || item.desc || '';
		info.appendChild(statsLine);

		// Ingredients row
		const ingRow = document.createElement('div');
		ingRow.className = 'craft-ingredients';
		for(const ing of recipe.ingredients){
			const ingItem = ITEM_DB[ing.itemId];
			if(!ingItem) continue;
			const have = getIngredientCount(ing.itemId);
			const el = document.createElement('span');
			el.className = 'craft-ing ' + (have >= ing.qty ? 'has' : 'missing');
			el.textContent = `${ingItem.icon} ${have}/${ing.qty}`;
			el.title = ingItem.name;
			ingRow.appendChild(el);
		}
		info.appendChild(ingRow);
		card.appendChild(info);

		// Craft button
		const btn = document.createElement('button');
		btn.className = 'craft-btn';
		btn.textContent = craftable ? 'Craft' : '🔒';
		btn.disabled = !craftable;
		btn.addEventListener('click', () => craftItem(recipe));
		card.appendChild(btn);

		wrap.appendChild(card);
	}
}

function craftItem(recipe){
	if(!canCraft(recipe)) return;
	// Consume ingredients
	for(const ing of recipe.ingredients){
		removeFromInventory(ing.itemId, ing.qty);
	}
	// Add result
	addToInventory(recipe.result, recipe.qty);
	saveState();
	renderCraftList();
	renderInventory();

	// Flash feedback
	const btn = document.querySelector('.craft-card .craft-btn');
	if(btn){
		const flash = document.createElement('div');
		flash.textContent = `✨ Crafted ${ITEM_DB[recipe.result]?.name}!`;
		flash.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:var(--rarity-' + (ITEM_DB[recipe.result]?.rarity||'common') + ');padding:12px 24px;border-radius:8px;font-size:16px;font-weight:bold;z-index:9999;pointer-events:none;animation:fadeUp .8s ease forwards';
		document.body.appendChild(flash);
		setTimeout(() => flash.remove(), 900);
	}
}

		el.addEventListener('click', e => {

		el.querySelector('.kb-btn:not(.sc-swap)').addEventListener('click', e => {
			e.stopPropagation();
			const btn = e.currentTarget;
			btn.textContent = '🔑 Press key...';

				renderSpellSlots();
			};
			document.addEventListener('keydown', handler, true);
		});
		wrap.appendChild(el);
	}
}

let editingVowSlot = 0;
let vowEditor = null; // temp vow during editing

function renderVowSlots(){
	const wrap = document.getElementById('vowSlots');
	wrap.innerHTML = '';
	for(let i = 0; i < 3; i++){

				: v.sacrifice === 'maxMana' ? `💧 -${v.amount} Mana`

	/* 4th slot: Domain Vow (only visible for dominion class) */
	if(STATE.mageClass === 'dominion'){

		const del = document.createElement('div');
		del.className = 'spell-slot';
		del.style.cursor = 'pointer';

			if(s.spellSlots && s.spellSlots.length) sacParts.push(`🔒${s.spellSlots.length}`);
			if(s.effects && s.effects.length) sacParts.push(`✨${s.effects.length}`);

			if(s.domProjectiles) sacParts.push('🚫Proj');
			if(s.domPlayerPower > 0) sacParts.push(`💔-${s.domPlayerPower}%`);

			const sacLabel = sacParts.length > 0 ? sacParts.join(' ') : 'No sacrifice';
			let boostLabel = '';
			if(dv.domainBuffs){

function openVowEditor(slotIdx){
	editingVowSlot = slotIdx;
	domainVowEditor = null; // ensure domain editor is cleared
	const existing = STATE.vows[slotIdx];
	if(existing){
		vowEditor = JSON.parse(JSON.stringify(existing));
		/* Migrate from old boosts dict to new single-boost format */
		if(vowEditor.boosts && vowEditor.boostType == null){
			let best = null, bestVal = 0;
			for(const k in vowEditor.boosts){
				if(vowEditor.boosts[k] > bestVal){ bestVal = vowEditor.boosts[k]; best = k; }
			}
			vowEditor.boostType = best || 'power';
			vowEditor.boostAmount = bestVal || 0;
			vowEditor.sizeBonus = false;
			delete vowEditor.boosts;
		}
	} else {
		vowEditor = { sacrifice:'health', amount:30, slots:[], targetSlot:0, boostType:'power', boostAmount:0, sizeBonus:false };
	}
	if(vowEditor.targetSlot == null) vowEditor.targetSlot = 0;
	document.getElementById('vowModal').style.display = 'flex';
	document.getElementById('vowModalTitle').textContent = `Vow Editor — Slot ${slotIdx+1}`;
	renderVowEditor();
}

function renderVowEditor(){
	const v = vowEditor;
	const pts = calcVowPoints(v, editingVowSlot);
	const spent = calcVowSpent(v);
	const remaining = pts - spent;
	let html = '';

	/* Compute spell slots already sacrificed by OTHER vows (cross-vow dedup) */
	const usedSlots = new Set();
	for(let i = 0; i < STATE.vows.length; i++){
		if(i === editingVowSlot) continue;
		const other = STATE.vows[i];
		if(other && other.sacrifice === 'spellSlot'){
			for(const s of other.slots||[]) usedSlots.add(s);
		}
	}

	// Target spell slot selector (not applicable for dualClass boost)
	const globalBoosts = new Set(['maxHealth','jumpHeight','playerSpeed','defense','elementalDmg','critChance','spellVamp','thorns','manaEfficiency']);
	const isGlobal = globalBoosts.has(v.boostType) || v.boostType === 'dualClass';
	if(!isGlobal){
		html += `<div style="font-size:13px;color:var(--muted);margin-bottom:2px">Target Spell (boosts apply to this spell only):</div>`;
		html += `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">`;
		for(let s=0;s<10;s++){
			const isTarget = v.targetSlot === s;
			const label = s===9?'⚡Ult':`${s+1}`;
			const spellName = STATE.spells[s]?.name || (s===9?'Ultimate':'Empty');
			html += `<div class="fx-chip ${isTarget?'active':''}" data-targetslot="${s}" style="cursor:pointer;padding:4px 8px;font-size:11px" title="${spellName}">${label}</div>`;
		}
		html += `</div>`;
	} else {
		html += `<div style="font-size:12px;color:#88bbff;margin-bottom:8px">🌐 This boost applies globally (not spell-specific)</div>`;
	}

	// Sacrifice type
	html += `<div style="font-size:13px;color:var(--muted)">Sacrifice something for power:</div>`;
	html += `<div style="display:flex;gap:6px;flex-wrap:wrap">`;
	for(const [k,info] of Object.entries(VOW_SACRIFICES)){
		const sel = v.sacrifice===k;
		html += `<div class="fx-chip ${sel?'active':''}" data-sac="${k}" style="cursor:pointer;padding:6px 10px;font-size:12px">${info.icon} ${info.label}</div>`;
	}
	html += `</div>`;

	// Amount / slot selection
	if(v.sacrifice === 'health'){
		html += `<div style="display:flex;align-items:center;gap:8px"><label style="font-size:12px;color:var(--muted)">Health to sacrifice: ${v.amount}%</label>
			<input type="range" min="5" max="50" step="5" value="${v.amount}" id="vowAmount" style="flex:1"/></div>`;
	} else if(v.sacrifice === 'maxMana'){
		html += `<div style="display:flex;align-items:center;gap:8px"><label style="font-size:12px;color:var(--muted)">Mana to sacrifice: ${v.amount} (${pts} pts)</label>
			<input type="range" min="100" max="1200" step="100" value="${v.amount}" id="vowAmount" style="flex:1"/></div>`;
	} else if(v.sacrifice === 'effects'){
		if(!v.sacrificedEffects) v.sacrificedEffects = [];
		/* Collect effects already sacrificed by OTHER vows */
		const usedEffects = new Set();
		for(let i = 0; i < STATE.vows.length; i++){
			if(i === editingVowSlot) continue;
			const other = STATE.vows[i];
			if(other && other.sacrifice === 'effects'){
				for(const fx of other.sacrificedEffects||[]) usedEffects.add(fx);
			}
		}
		html += `<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Select effects to give up (0.5pts each, 1pt for elemental):</div>`;
		html += `<div style="display:flex;gap:4px;flex-wrap:wrap">`;
		for(const [fx,info] of Object.entries(EFFECTS)){
			const isSac = v.sacrificedEffects.includes(fx);
			const takenByOther = usedEffects.has(fx);
			const isElem = info.category === 'elemental';
			const ptLabel = isElem ? '1pt' : '0.5pt';
			if(takenByOther && !isSac){
				html += `<div class="fx-chip" style="padding:3px 7px;font-size:10px;opacity:0.35;cursor:not-allowed;text-decoration:line-through" title="Already sacrificed">${info.icon} ${info.label}</div>`;
			} else {
				html += `<div class="fx-chip ${isSac?'active':''}" data-sacfx="${fx}" style="cursor:pointer;padding:3px 7px;font-size:10px" title="${ptLabel}">${info.icon} ${info.label} <span style="font-size:9px;opacity:0.6">(${ptLabel})</span></div>`;
			}
		}
		html += `</div>`;
	} else if(v.sacrifice === 'shapes'){
		if(!v.sacrificedShapes) v.sacrificedShapes = [];
		/* Collect shapes already sacrificed by OTHER vows */
		const usedShapes = new Set();
		for(let i = 0; i < STATE.vows.length; i++){
			if(i === editingVowSlot) continue;
			const other = STATE.vows[i];
			if(other && other.sacrifice === 'shapes'){
				for(const sh of other.sacrificedShapes||[]) usedShapes.add(sh);
			}
		}
		html += `<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Select shapes to give up (1pt each):</div>`;
		html += `<div style="display:flex;gap:4px;flex-wrap:wrap">`;
		for(const [sh,info] of Object.entries(SHAPES)){
			const isSac = v.sacrificedShapes.includes(sh);
			const takenByOther = usedShapes.has(sh);
			if(takenByOther && !isSac){
				html += `<div class="fx-chip" style="padding:3px 7px;font-size:10px;opacity:0.35;cursor:not-allowed;text-decoration:line-through" title="Already sacrificed">${info.icon} ${info.label}</div>`;
			} else {
				html += `<div class="fx-chip ${isSac?'active':''}" data-sacshape="${sh}" style="cursor:pointer;padding:3px 7px;font-size:10px">${info.icon} ${info.label}</div>`;
			}
		}
		html += `</div>`;
	} else if(v.sacrifice === 'spellSlot'){
		html += `<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Select spell slots to sacrifice:</div>`;
		html += `<div style="display:flex;gap:4px;flex-wrap:wrap">`;
		for(let s=0;s<10;s++){
			const isLocked = (v.slots||[]).includes(s);
			const takenByOther = usedSlots.has(s);
			const label = s===9?'⚡Ult':`${s+1}`;
			if(takenByOther && !isLocked){
				html += `<div class="fx-chip" style="padding:4px 8px;font-size:11px;opacity:0.35;cursor:not-allowed;text-decoration:line-through" title="Already sacrificed in another vow">${label}</div>`;
			} else {
				html += `<div class="fx-chip ${isLocked?'active':''}" data-lockslot="${s}" style="cursor:pointer;padding:4px 8px;font-size:11px">${label}</div>`;
			}
		}
		html += `</div>`;
	} else if(v.sacrifice === 'movement'){
		if(!v.amount) v.amount = 10;
		html += `<div style="display:flex;align-items:center;gap:8px"><label style="font-size:12px;color:var(--muted)">Movement speed penalty: ${v.amount}% (${pts} pts)</label>
			<input type="range" min="10" max="50" step="5" value="${v.amount}" id="vowAmount" style="flex:1"/></div>`;
	} else if(v.sacrifice === 'visibility'){
		if(!v.amount) v.amount = 15;
		html += `<div style="display:flex;align-items:center;gap:8px"><label style="font-size:12px;color:var(--muted)">Vision reduction: ${v.amount}% (${pts} pts)</label>
			<input type="range" min="15" max="60" step="15" value="${v.amount}" id="vowAmount" style="flex:1"/></div>`;
	} else if(v.sacrifice === 'items'){
		if(!v.sacrificedItemSlots) v.sacrificedItemSlots = [];
		const EQUIP_SLOTS = ['staff','robe','relic1','relic2'];
		const SLOT_LABELS = {staff:'🪄 Staff',robe:'👘 Robe',relic1:'💎 Relic 1',relic2:'💎 Relic 2'};
		/* Gather slots already sacrificed in other vows */
		const usedItemSlots = new Set();
		for(let i=0;i<STATE.vows.length;i++){
			if(i===editingVowSlot) continue;
			const other = STATE.vows[i];
			if(other && other.sacrifice === 'items') for(const sl of other.sacrificedItemSlots||[]) usedItemSlots.add(sl);
		}
		html += `<div style="font-size:12px;color:var(--muted);margin-bottom:4px">Sacrifice equipped gear (10/15/20/30 pts):</div>`;
		html += `<div style="display:flex;gap:6px;flex-wrap:wrap">`;
		for(const slot of EQUIP_SLOTS){
			const itemId = STATE.equipment[slot];
			const item = itemId ? ITEM_DB[itemId] : null;
			const isSac = v.sacrificedItemSlots.includes(slot);
			const takenByOther = usedItemSlots.has(slot);
			if(!item){
				html += `<div class="fx-chip" style="padding:4px 8px;font-size:10px;opacity:0.3;cursor:not-allowed">${SLOT_LABELS[slot]} (empty)</div>`;
			} else if(takenByOther && !isSac){
				html += `<div class="fx-chip" style="padding:4px 8px;font-size:10px;opacity:0.35;cursor:not-allowed;text-decoration:line-through" title="Already sacrificed">${item.icon} ${item.name}</div>`;

	html += `<div style="font-size:13px;color:#ffcc44;padding:6px 0;border-top:1px solid var(--border)">
		Vow Points: <strong>${spent}</strong> / <strong>${pts}</strong> available (${remaining} remaining)</div>`;

	// Enhancement: pick ONE boost type
	html += `<div style="font-size:12px;color:var(--muted);margin-bottom:2px">Choose ONE enhancement:</div>`;

	for(const [k,info] of Object.entries(VOW_BOOST_TYPES)){

	if(v.boostType === 'dualClass'){

			html += `<div class="fx-chip ${isSelected?'active':''}" data-secondclass="${cls.id}" style="cursor:pointer;padding:6px 12px;font-size:12px;border-color:${cls.color}" title="${cls.desc}">${cls.icon} ${cls.name}</div>`;
		}

		if(v.secondClass){

		html += `<div style="font-size:10px;color:#888;margin-bottom:4px">${info.desc}</div>`;

		if(v.boostType === 'power'){
			html += `<div style="margin-top:2px"><label style="font-size:11px;color:var(--muted);cursor:pointer">
				<input type="checkbox" id="vowSizeBonus" ${v.sizeBonus?'checked':''}/> 🎨 +50% Spell Size Bonus (cosmetic fun!)
			</label></div>`;
		}
	}

	/* ── VOW UNLOCKS — spend 5pts each to unlock item-gated shapes/behaviors/effects ── */
	if(!v.vowUnlocks) v.vowUnlocks = [];
	const allLocked = [];
	for(const [sh, itemId] of Object.entries(SHAPE_ITEM_REQ)){
		const info = SHAPES[sh];
		if(info) allLocked.push({type:'shape',key:sh,label:`${info.icon} ${info.label}`,itemId, tag:'shape:'+sh});
	}
	for(const [bh, itemId] of Object.entries(BEH_ITEM_REQ)){
		const info = BEHAVIORS[bh];
		if(info) allLocked.push({type:'behavior',key:bh,label:`${info.icon||'⚙️'} ${info.label}`,itemId, tag:'behavior:'+bh});
	}
	for(const [fx, itemId] of Object.entries(EFFECT_ITEM_REQ)){
		const info = EFFECTS[fx];
		if(info) allLocked.push({type:'effect',key:fx,label:`${info.icon} ${info.label}`,itemId, tag:'effect:'+fx});
	}
	/* Gather unlocks from OTHER vows to avoid duplicates */
	const otherUnlocks = new Set();
	for(let i=0;i<STATE.vows.length;i++){
		if(i===editingVowSlot) continue;
		const other = STATE.vows[i];
		if(other && other.vowUnlocks) for(const u of other.vowUnlocks) otherUnlocks.add(u);
	}
	if(allLocked.length){
		html += `<div style="font-size:13px;color:var(--muted);margin-top:8px;border-top:1px solid var(--border);padding-top:6px">🔓 Unlock item-gated abilities (5 pts each):</div>`;
		html += `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">`;
		for(const lock of allLocked){
			const isUnlocked = v.vowUnlocks.includes(lock.tag);
			const takenByOther = otherUnlocks.has(lock.tag);
			const alreadyHasItem = hasItemEquipped(lock.itemId);
			if(alreadyHasItem){
				html += `<div class="fx-chip" style="padding:3px 7px;font-size:10px;opacity:0.35;cursor:not-allowed" title="Already equipped via item">✅ ${lock.label}</div>`;
			} else if(takenByOther && !isUnlocked){
				html += `<div class="fx-chip" style="padding:3px 7px;font-size:10px;opacity:0.35;cursor:not-allowed;text-decoration:line-through" title="Unlocked in another vow">${lock.label}</div>`;
			} else {
				html += `<div class="fx-chip ${isUnlocked?'active':''}" data-vowunlock="${lock.tag}" style="cursor:pointer;padding:3px 7px;font-size:10px" title="${lock.type}: ${lock.key} (5pts)">${lock.label} <span style="font-size:9px;opacity:0.6">(5pt)</span></div>`;
			}
		}
		html += `</div>`;
	}

	document.getElementById('vowModalBody').innerHTML = html;

	// === EVENT LISTENERS ===

	// Target spell slot selection
	document.querySelectorAll('#vowModalBody [data-targetslot]').forEach(el => {
		el.addEventListener('click', () => {
			vowEditor.targetSlot = +el.dataset.targetslot;
			renderVowEditor();
		});
	});

	// Sacrifice type selection
	document.querySelectorAll('#vowModalBody [data-sac]').forEach(el => {
		el.addEventListener('click', () => {
			vowEditor.sacrifice = el.dataset.sac;
			if(vowEditor.sacrifice === 'health') vowEditor.amount = 10;
			else if(vowEditor.sacrifice === 'maxMana') vowEditor.amount = 300;
			else if(vowEditor.sacrifice === 'effects') vowEditor.sacrificedEffects = vowEditor.sacrificedEffects || [];
			else if(vowEditor.sacrifice === 'shapes') vowEditor.sacrificedShapes = vowEditor.sacrificedShapes || [];
			else vowEditor.slots = vowEditor.slots || [];
			renderVowEditor();
		});
	});

	// Amount slider
	const amtEl = document.getElementById('vowAmount');
	if(amtEl){
		amtEl.addEventListener('input', () => {
			vowEditor.amount = +amtEl.value;
			const newPts = calcVowPoints(vowEditor, editingVowSlot);
			if((vowEditor.boostAmount||0) > newPts) vowEditor.boostAmount = newPts;
			renderVowEditor();
		});
	}

	// Effect sacrifice toggles
	document.querySelectorAll('#vowModalBody [data-sacfx]').forEach(el => {
		el.addEventListener('click', () => {
			const fx = el.dataset.sacfx;
			if(!vowEditor.sacrificedEffects) vowEditor.sacrificedEffects = [];
			const idx = vowEditor.sacrificedEffects.indexOf(fx);
			if(idx >= 0) vowEditor.sacrificedEffects.splice(idx, 1);
			else vowEditor.sacrificedEffects.push(fx);
			const newPts = calcVowPoints(vowEditor, editingVowSlot);
			if((vowEditor.boostAmount||0) > newPts) vowEditor.boostAmount = newPts;
			renderVowEditor();
		});
	});

	// Shape sacrifice toggles
	document.querySelectorAll('#vowModalBody [data-sacshape]').forEach(el => {
		el.addEventListener('click', () => {
			const sh = el.dataset.sacshape;
			if(!vowEditor.sacrificedShapes) vowEditor.sacrificedShapes = [];
			const idx = vowEditor.sacrificedShapes.indexOf(sh);
			if(idx >= 0) vowEditor.sacrificedShapes.splice(idx, 1);
			else vowEditor.sacrificedShapes.push(sh);
			const newPts = calcVowPoints(vowEditor, editingVowSlot);
			if((vowEditor.boostAmount||0) > newPts) vowEditor.boostAmount = newPts;
			renderVowEditor();
		});
	});

	// Item sacrifice toggles
	document.querySelectorAll('#vowModalBody [data-sacitem]').forEach(el => {
		el.addEventListener('click', () => {
			const slot = el.dataset.sacitem;
			if(!vowEditor.sacrificedItemSlots) vowEditor.sacrificedItemSlots = [];
			const idx = vowEditor.sacrificedItemSlots.indexOf(slot);
			if(idx >= 0) vowEditor.sacrificedItemSlots.splice(idx, 1);
			else vowEditor.sacrificedItemSlots.push(slot);
			const newPts = calcVowPoints(vowEditor, editingVowSlot);
			if((vowEditor.boostAmount||0) > newPts) vowEditor.boostAmount = newPts;
			renderVowEditor();
		});
	});

	// Spell slot toggles (respect cross-vow dedup)
	document.querySelectorAll('#vowModalBody [data-lockslot]').forEach(el => {
		el.addEventListener('click', () => {
			const s = +el.dataset.lockslot;
			if(!vowEditor.slots) vowEditor.slots = [];
			const idx = vowEditor.slots.indexOf(s);
			if(idx >= 0) vowEditor.slots.splice(idx, 1);
			else vowEditor.slots.push(s);
			/* Clamp boostAmount to new pts total */
			const newPts = calcVowPoints(vowEditor, editingVowSlot);
			if((vowEditor.boostAmount||0) > newPts) vowEditor.boostAmount = newPts;
			renderVowEditor();
		});
	});

	// Boost type selection (pick one)
	document.querySelectorAll('#vowModalBody [data-boosttype]').forEach(el => {
		el.addEventListener('click', () => {
			vowEditor.boostType = el.dataset.boosttype;
			if(vowEditor.boostType !== 'power') vowEditor.sizeBonus = false;
			if(vowEditor.boostType !== 'dualClass') delete vowEditor.secondClass;
			renderVowEditor();
		});
	});

	// Boost amount slider
	const boostAmtEl = document.getElementById('vowBoostAmt');
	if(boostAmtEl){
		boostAmtEl.addEventListener('input', () => {
			vowEditor.boostAmount = +boostAmtEl.value;
			renderVowEditor();

	// Size bonus checkbox
	const sizeEl = document.getElementById('vowSizeBonus');
	if(sizeEl){

			vowEditor.sizeBonus = sizeEl.checked;

	// Second class selection (for dualClass enhancement)
	document.querySelectorAll('#vowModalBody [data-secondclass]').forEach(el => {

	document.querySelectorAll('#vowModalBody [data-vowunlock]').forEach(el => {

			if(!vowEditor.vowUnlocks) vowEditor.vowUnlocks = [];
			const idx = vowEditor.vowUnlocks.indexOf(tag);
			if(idx >= 0) vowEditor.vowUnlocks.splice(idx, 1);
			else vowEditor.vowUnlocks.push(tag);
			renderVowEditor();

	});
}

/* =============================================================
   DOMAIN VOW SYSTEM — 4th special vow slot for Dominion Master
   ============================================================= */
let domainVowEditor = null; // temp domain vow during editing

/* Default empty multi-sacrifice domain vow */
function emptyDomainVow(){
	return {
		sacrifices: {
			health: 0, maxMana: 0, spellSlots: [], effects: [], shapes: [],
			movement: 0, visibility: 0, items: [],
			domProjectiles: false, domPlayerPower: 0, domRange: 0,
		},
		domainBuffs: {},
		vowUnlocks: [],
	};
}
/* Migrate old single-sacrifice format to new multi-sacrifice format */
function migrateDomainVow(dv){
	if(!dv) return null;
	if(dv.sacrifices){
		if(dv.domainBuffs){
			for(const k in dv.domainBuffs){
				const info = DOMAIN_VOW_BUFFS[k];
				if(info && !info.binary) dv.domainBuffs[k] = Math.min(info.max || 5, dv.domainBuffs[k] || 0);
			}
		}
		return dv;
	}
	const nv = emptyDomainVow();
	nv.domainBuffs = dv.domainBuffs || {};
	for(const k in nv.domainBuffs){
		const info = DOMAIN_VOW_BUFFS[k];
		if(info && !info.binary) nv.domainBuffs[k] = Math.min(info.max || 5, nv.domainBuffs[k] || 0);
	}
	nv.vowUnlocks = dv.vowUnlocks || [];
	const s = nv.sacrifices;
	if(dv.sacrifice === 'health') s.health = dv.amount || 10;
	else if(dv.sacrifice === 'maxMana') s.maxMana = dv.amount || 300;
	else if(dv.sacrifice === 'spellSlot') s.spellSlots = dv.slots || [];
	else if(dv.sacrifice === 'effects') s.effects = dv.sacrificedEffects || [];
	else if(dv.sacrifice === 'shapes') s.shapes = dv.sacrificedShapes || [];
	else if(dv.sacrifice === 'movement') s.movement = dv.amount || 10;
	else if(dv.sacrifice === 'visibility') s.visibility = dv.amount || 15;
	else if(dv.sacrifice === 'items') s.items = dv.sacrificedItemSlots || [];
	return nv;
}

function calcDomainVowPoints(vow){
	if(!vow || !vow.sacrifices) return 0;
	const s = vow.sacrifices;
	let pts = 0;
	// Health
	if(s.health > 0) pts += Math.floor(s.health / 5);
	// Max Mana
	if(s.maxMana > 0){ const ratio = s.maxMana / 1200; pts += Math.floor(40 * Math.pow(ratio, 1.3)); }
	// Spell Slots
	if(s.spellSlots && s.spellSlots.length > 0){
		let otherCount = 0;
		for(const other of STATE.vows){ if(other && other.sacrifice === 'spellSlot') otherCount += (other.slots||[]).filter(x=>x!==9).length; }
		const regularSlots = s.spellSlots.filter(x=>x!==9);
		const hasUlt = s.spellSlots.includes(9);
		for(let i = 0; i < regularSlots.length; i++) pts += Math.max(1, otherCount + i);
		if(hasUlt) pts += 8;
	}
	// Effects
	if(s.effects && s.effects.length > 0){
		for(const fx of s.effects){ const eff = EFFECTS[fx]; pts += (eff && eff.category === 'elemental') ? 1 : 0.5; }
		pts = Math.floor(pts);
	}
	// Shapes
	if(s.shapes) pts += s.shapes.length;
	// Movement
	if(s.movement > 0) pts += Math.floor(s.movement / 5);
	// Visibility
	if(s.visibility > 0){ pts += Math.floor(s.visibility / 15) + Math.floor(s.visibility / 30); }
	// Items
	if(s.items && s.items.length > 0){
		let otherCount = 0;
		for(const other of STATE.vows){ if(other && other.sacrifice === 'items') otherCount += (other.sacrificedItemSlots||[]).length; }
		const ITEM_PTS = [10, 15, 20, 30];
		for(let i = 0; i < s.items.length; i++){ const idx = otherCount + i; pts += idx < ITEM_PTS.length ? ITEM_PTS[idx] : 30; }
	}
	// Domain-specific sacrifices
	if(s.domProjectiles) pts += DOMAIN_SACRIFICES.domProjectiles.pts;
	if(s.domPlayerPower > 0) pts += Math.floor(s.domPlayerPower / 10) * DOMAIN_SACRIFICES.domPlayerPower.ptsPerStep;
	if(s.domRange > 0) pts += Math.floor(s.domRange / 10) * DOMAIN_SACRIFICES.domRange.ptsPerStep;
	return pts;
}

function calcDomainVowSpent(vow){
	if(!vow || !vow.domainBuffs) return 0;
	let spent = 0;
	for(const k in vow.domainBuffs){
		const info = DOMAIN_VOW_BUFFS[k];
		if(info && info.binary) spent += vow.domainBuffs[k] ? info.cost : 0;
		else spent += vow.domainBuffs[k] || 0;
	}
	if(vow.vowUnlocks) spent += vow.vowUnlocks.length * 5;
	return spent;
}

function openDomainVowEditor(){
	const existing = STATE.domainVow;
	if(existing){
		domainVowEditor = JSON.parse(JSON.stringify(migrateDomainVow(existing)));
	} else {
		domainVowEditor = emptyDomainVow();
	}
	if(!domainVowEditor.domainBuffs) domainVowEditor.domainBuffs = {};
	document.getElementById('vowModal').style.display = 'flex';
	document.getElementById('vowModalTitle').textContent = '👁️ Domain Vow Editor';
	renderDomainVowEditor();
}

function renderDomainVowEditor(){
	const v = domainVowEditor;
	const s = v.sacrifices;
	const pts = calcDomainVowPoints(v);
	const spent = calcDomainVowSpent(v);
	const remaining = pts - spent;
	let html = '';

	html += `<div style="font-size:12px;color:#e74c3c;margin-bottom:6px;padding:6px;border:1px solid rgba(231,76,60,.3);border-radius:4px;background:rgba(231,76,60,.08)">
		👁️ <strong>Domain Vow</strong> — Sacrifice <em>multiple</em> things to empower your Domain Expansion with special rules and abilities.</div>`;

	/* Cross-vow dedup for spell slots */
	const usedSlots = new Set();
	for(const other of STATE.vows){ if(other && other.sacrifice === 'spellSlot') for(const x of other.slots||[]) usedSlots.add(x); }
	const usedEffects = new Set();
	for(const other of STATE.vows){ if(other && other.sacrifice === 'effects') for(const fx of other.sacrificedEffects||[]) usedEffects.add(fx); }
	const usedShapes = new Set();
	for(const other of STATE.vows){ if(other && other.sacrifice === 'shapes') for(const sh of other.sacrificedShapes||[]) usedShapes.add(sh); }
	const usedItemSlots = new Set();
	for(const other of STATE.vows){ if(other && other.sacrifice === 'items') for(const sl of other.sacrificedItemSlots||[]) usedItemSlots.add(sl); }

	// ─── GENERAL SACRIFICES (stack globally) ───
	html += `<div style="font-size:13px;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:2px;margin-bottom:4px">General Sacrifices <span style="font-size:10px;opacity:.6">(these apply at all times)</span></div>`;

	// Health

	// ─── DOMAIN BUFFS ───
	html += `<div style="font-size:13px;color:#e74c3c;margin-bottom:4px;border-top:1px solid rgba(231,76,60,.2);padding-top:6px">👁️ Allocate points to Domain Rules:</div>`;
	for(const [k,info] of Object.entries(DOMAIN_VOW_BUFFS)){
		const amt = v.domainBuffs[k] || 0;

			else if(key === 'domRange'){

function clampDomainBuffs(){
	// Block domainRange buff when domRange sacrifice is active
	if(domainVowEditor.sacrifices.domRange > 0) domainVowEditor.domainBuffs.domainRange = 0;
	const buffs = domainVowEditor.domainBuffs;
	for(const k in buffs){
		const info = DOMAIN_VOW_BUFFS[k];
		if(info && !info.binary) buffs[k] = Math.min(info.max || 5, buffs[k] || 0);
	}
	const pts = calcDomainVowPoints(domainVowEditor);
	const spent = calcDomainVowSpent(domainVowEditor);
	if(spent > pts){
		const buffs = domainVowEditor.domainBuffs;
		// First remove binary abilities that are over budget
		for(const k in buffs){
			const info = DOMAIN_VOW_BUFFS[k];
			if(info && info.binary && buffs[k]){
				const newSpent = calcDomainVowSpent(domainVowEditor);
				if(newSpent > calcDomainVowPoints(domainVowEditor)) buffs[k] = 0;
			}
		}
		// Then proportionally reduce scalable buffs
		let total = 0;
		for(const k in buffs){ const info = DOMAIN_VOW_BUFFS[k]; if(!info || !info.binary) total += buffs[k]; }
		if(total > 0){
			const binaryCost = calcDomainVowSpent(domainVowEditor) - total;
			const available = Math.max(0, calcDomainVowPoints(domainVowEditor) - binaryCost);
			const ratio = available / total;
			for(const k in buffs){ const info = DOMAIN_VOW_BUFFS[k]; if(!info || !info.binary) buffs[k] = Math.floor(buffs[k] * ratio); }
		}
	}
}

/* Override save/clear/cancel for domain vow mode */
const origSave = document.getElementById('vowSaveBtn');
const origClear = document.getElementById('vowClearBtn');
const origCancel = document.getElementById('vowCancelBtn');
const origClose = document.getElementById('vowModalClose');

function handleVowSave(){
	if(domainVowEditor){
		const pts = calcDomainVowPoints(domainVowEditor);
		const spent = calcDomainVowSpent(domainVowEditor);
		if(spent > pts){ alert('Not enough domain vow points!'); return; }
		STATE.domainVow = domainVowEditor;
		domainVowEditor = null;
		writeExtrasToActiveLoadout();
		saveState();
		renderVowSlots();
		notifyGameSpellsChanged();
		document.getElementById('vowModal').style.display='none';
	} else {
		const pts = calcVowPoints(vowEditor, editingVowSlot);
		const spent = calcVowSpent(vowEditor);
		if(spent > pts){ alert('Not enough vow points! Remove some boosts or sacrifice more.'); return; }
		// Dual class enhancement: require a second class to be chosen
		if(vowEditor.boostType === 'dualClass' && !vowEditor.secondClass){
			alert('Please choose a second class for the Dual Class enhancement.'); return;
		}
		// Enforce only one dualClass boost across all slots
		if(vowEditor.boostType === 'dualClass'){
			for(let i=0; i<STATE.vows.length; i++){
				if(i===editingVowSlot) continue;
				if(STATE.vows[i] && STATE.vows[i].boostType === 'dualClass'){
					alert('You can only use Dual Class in one vow at a time.'); return;
				}
			}
		}
		if(vowEditor.boosts) delete vowEditor.boosts;
		// For non-dualClass, apply default boost fields
		if(vowEditor.boostType !== 'dualClass'){
			if(vowEditor.boostType == null) vowEditor.boostType = 'power';
			if(vowEditor.boostAmount == null) vowEditor.boostAmount = 0;
			if(vowEditor.sizeBonus == null) vowEditor.sizeBonus = false;
		}
		STATE.vows[editingVowSlot] = vowEditor;
		// Sync mageClass2 from active dual class boost
		const dualVow = STATE.vows.find(v => v && v.boostType === 'dualClass' && v.secondClass);
		STATE.mageClass2 = dualVow ? dualVow.secondClass : 'none';
		writeExtrasToActiveLoadout();
		saveState();
		renderVowSlots();
		renderSpellSlots();
		notifyGameSpellsChanged();
		document.getElementById('vowModal').style.display='none';
	}
}
function handleVowClear(){
	if(domainVowEditor){
		STATE.domainVow = null;
		domainVowEditor = null;
		writeExtrasToActiveLoadout();
		saveState();
		renderVowSlots();
		notifyGameSpellsChanged();
		document.getElementById('vowModal').style.display='none';
	} else {
		STATE.vows[editingVowSlot] = null;
		// Sync mageClass2 after clearing
		const dualVow = STATE.vows.find(v => v && v.boostType === 'dualClass' && v.secondClass);
		STATE.mageClass2 = dualVow ? dualVow.secondClass : 'none';
		writeExtrasToActiveLoadout();
		saveState();
		renderVowSlots();
		renderSpellSlots();
		notifyGameSpellsChanged();

}

/* =============================================================
   RUNE FORGE — every slot opens the programmable rune tree editor
   ============================================================= */
function storeSlotSpell(slotIdx, def){
	STATE.spells[slotIdx] = def;
	if(STATE.activeLoadoutIdx >= 0 && STATE.activeLoadoutIdx < STATE.loadouts.length){
		STATE.loadouts[STATE.activeLoadoutIdx].spells[slotIdx] = def ? JSON.parse(JSON.stringify(def)) : null;
		if(STATE.loadouts[STATE.activeLoadoutIdx].type === 'transformation')
			STATE.transformSpells[slotIdx] = def ? JSON.parse(JSON.stringify(def)) : null;
	}
	saveState();
	renderSpellSlots();
	notifyGameSpellsChanged();
}
function openSlotChooser(slotIdx){
	if(typeof SlotChooser === 'undefined'){ openSpellBuilder(slotIdx); return; }
	SlotChooser.open({
		slot: slotIdx,
		current: STATE.spells[slotIdx],
		tint: null,
		onSpell: function(){ openSpellBuilder(slotIdx, true); },
		onWeapon: function(id, name){
			const cur = STATE.spells[slotIdx], ws = MagicEngine.makeWeaponSlot(id, name);
			if(cur && cur.kind === 'weapon' && cur.weaponId === id && cur.engraved) ws.engraved = cur.engraved;      // same weapon keeps its engraving
			if(cur && cur.kind === 'weapon' && cur.weaponId === id && cur.item) ws.item = cur.item;                // …and a magical item keeps what it holds
			storeSlotSpell(slotIdx, ws);
		},
		onEngrave: function(){ openEngraveForge(slotIdx); },
		onUnengrave: function(){ const cur = STATE.spells[slotIdx]; if(cur && cur.kind === 'weapon'){ const ws = JSON.parse(JSON.stringify(cur)); delete ws.engraved; storeSlotSpell(slotIdx, ws); } },
		onClear: function(){ storeSlotSpell(slotIdx, null); }
	});
}
/* engrave a rune spell into a weapon's special: the forge edits the spell stored on the weapon slot */
function openEngraveForge(slotIdx){
	if(typeof MagicForge === 'undefined'){ alert('The Rune Forge failed to load. Refresh and try again.'); return; }
	const ws = STATE.spells[slotIdx];
	if(!ws || ws.kind !== 'weapon') return;
	const wd = window.MELEE_WEAPONS && window.MELEE_WEAPONS.weapons[ws.weaponId];
	const wName = wd ? wd.name : (ws.name || 'Weapon');
	const spName = wd && wd.moves && wd.moves.special ? wd.moves.special.name : 'Special';
	const spell = ws.engraved && MagicEngine.isMagicSpell(ws.engraved) ? JSON.parse(JSON.stringify(ws.engraved)) : MagicEngine.blankSpell(spName + ' Engraving');
	MagicForge.open({
		slot: slotIdx,
		slotLabel: wName + ' · ' + spName + ' engraving',
		clearLabel: 'Remove engraving',
		clearText: 'This removes the spell engraved into the ' + wName + '\'s special. The weapon stays in its slot.',
		spell,
		profile: magicProfileFor(),
		onSave: function(def){ const cur = STATE.spells[slotIdx]; if(!cur || cur.kind !== 'weapon') return; const n = JSON.parse(JSON.stringify(cur)); delete def.isUltimate; n.engraved = def; storeSlotSpell(slotIdx, n); },
		onClear: function(){ const cur = STATE.spells[slotIdx]; if(!cur || cur.kind !== 'weapon') return; const n = JSON.parse(JSON.stringify(cur)); delete n.engraved; storeSlotSpell(slotIdx, n); },
		onProfileChange: function(mp){ STATE.magicProfile = mp; saveState(); notifyGameSpellsChanged(); },
		onClose: function(){ renderSpellSlots(); }
	});
}
function openSpellBuilder(slotIdx){
	if(typeof MagicForge === 'undefined'){ alert('The Rune Forge failed to load. Refresh and try again.'); return; }
	const existing = STATE.spells[slotIdx];
	const spell = MagicEngine.isMagicSpell(existing) ? JSON.parse(JSON.stringify(existing)) : MagicEngine.blankSpell('Spell ' + (slotIdx === 9 ? '0' : slotIdx + 1));
	MagicForge.open({
		slot: slotIdx,
		slotLabel: 'Slot ' + (slotIdx === 9 ? '0' : slotIdx + 1),
		spell,
		profile: magicProfileFor(),
		onSave: function(def){ delete def.isUltimate; storeSlotSpell(slotIdx, def); },
		onClear: function(){ storeSlotSpell(slotIdx, null); },
		onProfileChange: function(mp){ STATE.magicProfile = mp; saveState(); notifyGameSpellsChanged(); },
		onClose: function(){ renderSpellSlots(); }
	});
}

/* =============================================================
   SPELL DESCRIPTION GENERATOR
   ============================================================= */
function generateSpellDescription(spell){
	if(spell && typeof MagicEngine !== 'undefined' && MagicEngine.isMagicSpell(spell)){
		const n = Object.keys(spell.nodes).length;
		const r = spell.nodes[spell.rootId], R = r && MagicEngine.Runes[r.type];
		return 'Rune spell — ' + n + ' rune' + (n === 1 ? '' : 's') + (R ? ', begins with ' + R.name : '') + '.';
	}
	if(!spell || !spell.phases || !spell.phases.length) return 'Empty spell.';
	const parts = [];
	spell.phases.forEach((ph, i) => {
		const shape = SHAPES[ph.shape]?.label || ph.shape;
		const beh   = BEHAVIORS[ph.behavior]?.label || ph.behavior;
		let s = '';
		if(i === 0) s += 'Cast '; else s += 'Then ';
		if(ph.count > 1) s += `${ph.count} `;
		s += `${shape.toLowerCase()}${ph.count>1?'s':''} `;

		// behavior description
		switch(ph.behavior){
			case 'straight':    s += 'flying forward'; break;
			case 'lob':         s += 'arcing through the air'; break;
			case 'homing':      s += 'homing toward the target'; break;
			case 'boomerang':   s += 'that returns to you'; break;
			case 'groundSurge': s += 'surging along the ground'; break;
			case 'orbit':       s += `orbiting you for ${ph.orbitDuration.toFixed(1)}s then launching`; break;
			case 'rain':        s += 'raining from above'; break;
			case 'ground':      s += 'erupting from the ground'; break;
			case 'stationary':  s += 'placed at your position'; break;
			case 'selfCast':    s += 'conjured at your feet'; break;
		}

		if(ph.power > 1.5) s += ' with great force';
		else if(ph.power < 0.7) s += ' gently';

		if(ph.effects.length){
			s += ', applying ' + ph.effects.map(fx => EFFECTS[fx]?.label?.toLowerCase()||fx).join(' & ');
		}

		s += '.';

		if(i < spell.phases.length - 1){
			const trig = ph.nextTrigger;
			if(trig === 'onHit') s += ' On hit:';
			else if(trig === 'afterHitDelay') s += ` After ${(ph.nextTriggerDelay||0.5).toFixed(1)}s at target:`;
			else if(trig === 'afterDelay') s += ' After a moment:';
			else if(trig === 'onExpire') s += ' When it fades:';
		}

		if(ph.effects.includes('phaseFork')){
			const pfd = ph.phaseForkDelay||1;
			const pfr = ph.phaseForkRepeats||1;
			s += ` Also forks to next phase after ${pfd.toFixed(1)}s`;
			if(pfr > 1) s += ` (${pfr}× repeats)`;
			if(ph.phaseForkCursorTrack) s += ' (cursor-guided, −15% dmg)';
			s += '.';
		}

		parts.push(s);
	});
	return parts.join(' ');
}

/* =============================================================
   UTILITY
   ============================================================= */
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* =============================================================

   ============================================================= */
function renderAll(){
	renderStats();
	renderEquipment();
	renderInventory();
	renderSpellSlots();
	renderVowSlots();
}

/* =============================================================
   EVENT WIRING
   ============================================================= */
document.getElementById('searchBox').addEventListener('input', e => {
	searchTerm = e.target.value.trim();
	invPage = 0;
	renderInventory();
});
document.getElementById('prevPage').addEventListener('click', () => { invPage--; renderInventory(); });
document.getElementById('nextPage').addEventListener('click', () => { invPage++; renderInventory(); });

// Crafting search + filter
document.getElementById('craftSearchBox').addEventListener('input', e => {
	craftSearch = e.target.value.trim();
	renderCraftList();
});
document.getElementById('craftFilter').addEventListener('change', e => {
	craftTypeFilter = e.target.value;
	renderCraftList();
});

document.getElementById('testBtn').addEventListener('click', () => {
	STATE.inventory = [];
	STATE.equipment = { staff:null, robe:null, relic1:null, relic2:null };
	if(typeof GearSystem !== 'undefined'){
		for(const inst of GearSystem.allBaseGearInstances()){
			STATE.inventory.push(inst);
			GearSystem.discover(STATE, inst);
		}
		for(const g of GearSystem.allGemEntries()){
			STATE.inventory.push(g);
			GearSystem.discoverGem(STATE, g.itemId, g.quality || 'perfect');
		}
	}
	saveState();
	renderAll();
});

// keyboard shortcut: Escape closes modal
document.addEventListener('keydown', e => {
	if(e.key === 'Escape'){
		if(document.getElementById('scrollModal') && document.getElementById('scrollModal').classList.contains('open')){ closeScrollPicker(); return; }
	}
});

if(window.self !== window.top){
	const bb = document.getElementById('backBtn');
	if(bb) bb.style.display = 'none';
}
